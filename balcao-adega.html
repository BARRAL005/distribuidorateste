    const s=db.sales.find(x=>x.id===m.id);if(!s)return '';
    body=`<h2 id="mdl-title">Cancelar a venda ${String(s.n).padStart(5,'0')}?</h2>
      <p style="margin:0 0 4px">Os itens voltam para o estoque e a venda sai dos totais, mas continua no histórico com o motivo.</p>
      <div class="fld"><label for="cancel-why">Motivo do cancelamento</label><textarea id="cancel-why" rows="3" data-first="1" aria-describedby="cancel-hint" placeholder="ex.: cliente desistiu, cobrança errada"></textarea>
        <p class="hint" id="cancel-hint">Obrigatório, com pelo menos 5 letras. Fica registrado com o seu nome.</p></div>
      <div class="row end"><button class="btn" data-a="closeModal">Voltar</button><button class="btn danger" data-a="confirmCancel">Cancelar venda</button></div>`;
  }else if(m.type==='cam'){
    body=`<h2 id="mdl-title">Aponte para o código de barras</h2>
      <video id="camvid" playsinline muted autoplay aria-label="Imagem da câmera para ler o código" style="display:block;width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover"></video>
      <p class="hint" style="margin-top:12px">A leitura é automática. Se não funcionar, feche e digite o código.</p>
      <div class="row end"><button class="btn" data-a="closeModal" data-first="1">Fechar</button></div>`;
  }else if(m.type==='perms'){
    const u=db.users.find(x=>x.id===m.id);if(!u)return '';
    body=`<h2 id="mdl-title">Permissões de ${esc(u.name)}</h2><p class="hint" style="margin:-4px 0 0">As mudanças valem na hora, em todos os aparelhos.</p><form data-form="savePerms" data-id="${u.id}">${permFieldset(permsOf(u),'pm')}
      <div class="row end"><button class="btn" type="button" data-a="closeModal" data-first="1">Cancelar</button><button class="btn pri" type="submit">Salvar permissões</button></div></form>`;
  }else if(m.type==='confirm'){
    body=`<h2 id="mdl-title">${esc(m.title)}</h2><p style="margin:0">${esc(m.text)}</p>
      ${m.word?`<div class="fld"><label for="conf-word">Para confirmar, digite <b class="mono">${esc(m.word)}</b></label><input id="conf-word" autocomplete="off" autocapitalize="characters" data-first="1" aria-describedby="conf-hint"><p class="hint" id="conf-hint">O botão libera quando a palavra estiver certa.</p></div>`:''}
      <div class="row end"><button class="btn" data-a="closeModal"${m.word?'':' data-first="1"'}>Voltar</button><button class="btn danger" data-a="confirmYes" id="conf-yes"${m.word?' disabled':''}>${esc(m.yes||'Confirmar')}</button></div>`;
  }
  return `<div class="overlay" data-a="overlay"><div class="${m.type==='product'?'modal wide':'modal'}" role="dialog" aria-modal="true" aria-labelledby="mdl-title">${body}</div></div>`;
}

/* ---------- relatórios em PDF e Excel (montados aqui, sem bibliotecas) ---------- */
function repName(ext,d){return 'fechamento-'+ui.rep.kind+'-'+dayKey(ui.rep.kind==='tudo'?Date.now():d.R.from)+'.'+ext}

/* PDF A4 com Helvetica. A largura dos números usa a tabela de Helvetica, para alinhar à direita. */
const PDFW=ch=>/[0-9]/.test(ch)?556:(ch===','||ch==='.'||ch===' '||ch===' ')?278:ch==='$'?556:ch==='%'?889:ch==='-'?333:ch==='R'?722:500;
const pdfTw=(s,z)=>{let w=0;for(const ch of String(s))w+=PDFW(ch);return w*z/1000};
const pdfClean=s=>String(s).replace(/[−–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x00-\xFF]/g,'?');
const pdfEsc=s=>pdfClean(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');

function reportPdf(d){
  const W=595,H=842,M=40,LH=14,pages=[];let cs='',y=H-M;
  /* T: texto com o topo em yt; R: retângulo; L: linha horizontal */
  const T=(x,yt,z,s,o={})=>{const f=o.bold?'/F2':'/F1',w=pdfTw(pdfClean(s),z);const xx=o.right?x-w:o.center?x-w/2:x;
    cs+='BT '+f+' '+z+' Tf '+(o.color||'0 0 0')+' rg '+xx.toFixed(1)+' '+(yt-z).toFixed(1)+' Td ('+pdfEsc(s)+') Tj ET\n'};
  const R=(x,yb,w,h,c)=>{cs+=c+' rg '+x.toFixed(1)+' '+yb.toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1)+' re f\n'};
  const L=(x1,x2,yy)=>{cs+='0.75 0.75 0.75 RG 0.5 w '+x1.toFixed(1)+' '+yy.toFixed(1)+' m '+x2.toFixed(1)+' '+yy.toFixed(1)+' l S\n'};
  const footer=()=>{T(W/2,22,7,'Página '+(pages.length+1)+' · Relatório interno, sem valor fiscal',{center:true,color:'0.45 0.45 0.45'})};
  const room=h=>{if(y-h<M+30){footer();pages.push(cs);cs='';y=H-M}};
  /* o título nunca fica sozinho no fim da página: reserva espaço para ele e as primeiras linhas */
  const sec=t=>{room(44+LH*3);y-=8;L(M,W-M,y);y-=16;T(M,y,12,t,{bold:true});y-=18};
  const kv=(k,v)=>{room(LH);T(M,y,10,k);T(W-M,y,10,v,{right:true});y-=LH};
  const table=(hd,rows,cols)=>{
    const xs=[];let x=M;cols.forEach(c=>{xs.push(x);x+=c.w});
    const row=(vals,bold)=>{room(LH);vals.forEach((v,i)=>{const c=cols[i],px=c.al==='r'?xs[i]+c.w:xs[i];T(px,y,9,v,{bold:bold,right:c.al==='r'})});y-=LH};
    row(hd,true);L(M,W-M,y+0.5);
    rows.forEach(r=>row(r,false));
    y-=6;
  };
  const chart=()=>{
    room(190);y-=8;T(M,y,12,'Faturamento por '+UNIT[ui.rep.kind],{bold:true});y-=20;
    const top=y,hgt=110,base=top-hgt,max=Math.max(1,...d.B.map(b=>b.t)),n=Math.max(1,d.B.length),bw=(W-2*M)/n;
    L(M,W-M,base);
    d.B.forEach((b,i)=>{const h=b.t?Math.max(1.5,hgt*b.t/max):0;if(h)R(M+i*bw+bw*0.18,base,bw*0.64,h,'0.788 0.635 0.294');
      if(i%Math.ceil(n/16)===0)T(M+i*bw+bw/2,base-4,7,b.sub?b.label+' '+b.sub:b.label,{center:true})});
    y=base-20;
  };

  /* cabeçalho */
  T(M,y,18,db.store.name,{bold:true});y-=24;
  T(M,y,13,'Fechamento de vendas',{bold:true});y-=17;
  T(M,y,11,d.R.label+(d.R.sub?' · '+d.R.sub:''));y-=15;
  T(M,y,8.5,'Gerado em '+new Date().toLocaleString('pt-BR'),{color:'0.4 0.4 0.4'});y-=22;

  sec('Resumo do período');
  kv('Faturamento líquido',brl(d.total));
  kv('Vendas concluídas',String(d.ok.length));
  kv('Ticket médio',brl(d.ok.length?d.total/d.ok.length:0));
  kv('Faturamento bruto (antes dos descontos)',brl(d.gross));
  kv('Descontos',brl(d.disc));
  if(d.fees>0)kv('Taxas de entrega (já no faturamento)',brl(d.fees));
  kv('Vendas canceladas',d.canc.length+' ('+brl(d.cancT)+')');
  kv('Itens vendidos',String(d.units));
  if(d.admin){kv('Custo das mercadorias',brl(d.cost));kv('Lucro bruto',brl(d.lucro));kv('Margem de lucro',pctTxt(d.margin))}

  sec('Caixa');
  kv('Dinheiro esperado (vendas em dinheiro)',brl(d.cashExp));
  const hasC=String(ui.cashCounted||'').trim()!=='';
  kv('Dinheiro contado',hasC?brl(num(ui.cashCounted)):'não informado');
  if(hasC){const df=num(ui.cashCounted)-d.cashExp;kv('Diferença',Math.abs(df)<0.005?'sem diferença':(df>0?'sobra de ':'falta de ')+brl(Math.abs(df)))}

  chart();

  sec('Por forma de pagamento');
  table(['Forma','Vendas','Total','%'],d.pays.map(p=>[p.name,String(p.n),brl(p.t),pctTxt(d.total?p.t/d.total*100:0)]),[{w:200},{w:90,al:'r'},{w:120,al:'r'},{w:105,al:'r'}]);

  if(d.seeAll){
    sec('Por vendedor');
    table(['Vendedor','Vendas','Total','Comissão'],d.sellers.map(s=>[s.name,String(s.n),brl(s.t),brl(s.c*s.comm/100)+' ('+s.comm+'%)']),[{w:200},{w:70,al:'r'},{w:120,al:'r'},{w:125,al:'r'}]);
  }

  sec('Mais vendidos');
  table(['Produto','Qtd','Faturamento'],d.prods.map(p=>[p.name,String(p.qty),brl(p.rev)]),[{w:275},{w:70,al:'r'},{w:170,al:'r'}]);

  sec('Vendas do período');
  table(['Nº','Data e hora','Vendedor','Pagamento','Total','Situação'],
    d.all.map(s=>[String(s.n).padStart(5,'0'),fmtTime(s.ts),s.sellerName,s.pay,brl(s.total),s.canceled?'Cancelada':'Concluída']),
    [{w:46},{w:100},{w:120},{w:110},{w:80,al:'r'},{w:59}]);

  footer();pages.push(cs);

  /* objetos: 1 catálogo, 2 páginas, 3 Helvetica, 4 Helvetica-Bold; cada página ocupa dois objetos */
  const N=pages.length,objs=['<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids ['+pages.map((_,i)=>(5+2*i)+' 0 R').join(' ')+'] /Count '+N+' >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
  pages.forEach((c,i)=>{
    objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>');
    objs.push('<< /Length '+c.length+' >>\nstream\n'+c+'endstream');
  });
  let out='%PDF-1.4\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
  const xr=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+
    'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return new Blob([u],{type:'application/pdf'});
}

/* Excel: planilha .xlsx montada à mão (XML dentro de um .zip sem compressão) */
function zipBlob(files){
  const T=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);T[n]=c>>>0}
  const crc=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
  const le16=v=>[v&255,(v>>>8)&255],le32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  const E=new TextEncoder(),out=[],cen=[];let off=0;
  files.forEach(f=>{
    const nm=E.encode(f.name),d=f.data,c=crc(d);
    const h=Uint8Array.from([...le32(0x04034b50),...le16(20),...le16(0),...le16(0),...le16(0),...le16(0x21),...le32(c),...le32(d.length),...le32(d.length),...le16(nm.length),...le16(0)]);
    out.push(h,nm,d);
    const ch=Uint8Array.from([...le32(0x02014b50),...le16(20),...le16(20),...le16(0),...le16(0),...le16(0),...le16(0x21),...le32(c),...le32(d.length),...le32(d.length),...le16(nm.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(off)]);
    cen.push(ch,nm);
    off+=h.length+nm.length+d.length;
  });
  const cdSize=cen.reduce((a,p)=>a+p.length,0);
  const end=Uint8Array.from([...le32(0x06054b50),...le16(0),...le16(0),...le16(files.length),...le16(files.length),...le32(cdSize),...le32(off),...le16(0)]);
  return new Blob([...out,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xlsxBlob(sheets){
  const E=new TextEncoder(),X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const col=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  const cell=(c,ref)=>{if(c===null||c===undefined||c==='')return '';const o=typeof c==='object'?c:{v:c};const st=o.s?' s="'+o.s+'"':'';
    if(typeof o.v==='number')return '<c r="'+ref+'"'+st+'><v>'+o.v+'</v></c>';
    return '<c r="'+ref+'" t="inlineStr"'+st+'><is><t xml:space="preserve">'+X(o.v)+'</t></is></c>'};
  const sheetXml=rows=>'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<cols><col min="1" max="1" width="36" customWidth="1"/><col min="2" max="9" width="18" customWidth="1"/></cols><sheetData>'+
    rows.map((r,ri)=>'<row r="'+(ri+1)+'">'+r.map((c,ci)=>cell(c,col(ci)+(ri+1))).join('')+'</row>').join('')+'</sheetData></worksheet>';
  const NS='http://schemas.openxmlformats.org/';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="'+NS+'package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="'+NS+'package/2006/relationships"><Relationship Id="rId1" Type="'+NS+'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="'+NS+'spreadsheetml/2006/main" xmlns:r="'+NS+'officeDocument/2006/relationships"><sheets>'+
    sheets.map((s,i)=>'<sheet name="'+X(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>';
  const wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="'+NS+'package/2006/relationships">'+
    sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="'+NS+'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+
    '<Relationship Id="rId'+(sheets.length+1)+'" Type="'+NS+'officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  /* estilos: 0 normal, 1 negrito (cabeçalhos), 2 número com duas casas, 3 percentual */
  const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="'+NS+'spreadsheetml/2006/main">'+
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'+
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+
    '<xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const files=[['[Content_Types].xml',ct],['_rels/.rels',rels],['xl/workbook.xml',wb],['xl/_rels/workbook.xml.rels',wbRels],['xl/styles.xml',styles]]
    .concat(sheets.map((s,i)=>['xl/worksheets/sheet'+(i+1)+'.xml',sheetXml(s.rows)]));
  return zipBlob(files.map(([n,t])=>({name:n,data:E.encode(t)})));
}
function reportXlsx(d){
  const money=v=>({v:Math.round((Number(v)||0)*100)/100,s:2}),pctc=v=>({v:Math.round((Number(v)||0)*100)/10000,s:3}),hd=t=>({v:t,s:1});
  const res=[[{v:db.store.name,s:1}],['Fechamento de vendas'],[d.R.label],['Gerado em',new Date().toLocaleString('pt-BR')],[],
    [hd('Indicador'),hd('Valor')],
    ['Faturamento líquido',money(d.total)],['Vendas concluídas',d.ok.length],['Ticket médio',money(d.ok.length?d.total/d.ok.length:0)],
    ['Faturamento bruto (antes dos descontos)',money(d.gross)],['Descontos',money(d.disc)],['Vendas canceladas',d.canc.length],['Valor cancelado',money(d.cancT)],['Itens vendidos',d.units]];
  if(d.fees>0)res.push(['Taxas de entrega (já no faturamento)',money(d.fees)]);
  if(d.admin)res.push(['Custo das mercadorias',money(d.cost)],['Lucro bruto',money(d.lucro)],['Margem de lucro',pctc(d.margin)]);
  res.push([],[hd('Caixa'),hd('Valor')],['Dinheiro esperado',money(d.cashExp)]);
  if(String(ui.cashCounted||'').trim()!==''){res.push(['Dinheiro contado',money(num(ui.cashCounted))],['Diferença (contado menos esperado)',money(num(ui.cashCounted)-d.cashExp)])}
  res.push([],[hd('Forma de pagamento'),hd('Vendas'),hd('Total'),hd('%')],...d.pays.map(p=>[p.name,p.n,money(p.t),pctc(d.total?p.t/d.total*100:0)]));
  const sheets=[{name:'Resumo',rows:res}];
  sheets.push({name:'Vendas',rows:[[hd('Nº'),hd('Data'),hd('Hora'),hd('Vendedor'),hd('Pagamento'),hd('Subtotal'),hd('Desconto'),hd('Total'),hd('Situação')],
    ...d.all.map(s=>[String(s.n).padStart(5,'0'),new Date(s.ts).toLocaleDateString('pt-BR'),fmtHour(s.ts),s.sellerName,s.pay,money(s.subtotal),money(s.discount),money(s.total),s.canceled?'Cancelada':'Concluída'])]});
  sheets.push({name:'Gráfico',rows:[[hd(ui.rep.kind==='dia'?'Hora':'Período'),hd('Vendas'),hd('Faturamento')],...d.B.map(b=>[b.full,b.n,money(b.t)])]});
  sheets.push({name:'Produtos',rows:[[hd('Produto'),hd('Quantidade'),hd('Faturamento')],...d.prods.map(p=>[p.name,p.qty,money(p.rev)])]});
  if(d.seeAll)sheets.push({name:'Vendedores',rows:[[hd('Vendedor'),hd('Vendas'),hd('Total'),hd('Comissão %'),hd('Comissão')],...d.sellers.map(s=>[s.name,s.n,money(s.t),s.comm,money(s.c*s.comm/100)])]});
  return xlsxBlob(sheets);
}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  if(!ready){app.innerHTML=bootView();return}
  if(mode==='signin'){app.innerHTML=signinView();return}
  if(ui.busy){app.innerHTML=bootView(ui.busy);return}
  /* sem usuários e a nuvem ainda não respondeu: não mostrar "Primeiro acesso", senão criaria um segundo dono */
  if(!db.users.length&&onCloud()&&(!loaded.users||migrating)){app.innerHTML=bootView(migrating?'Copiando os dados da versão anterior...':'Não consegui carregar os dados da nuvem. Recarregue a página.');return}
  if(!db.users.length){app.innerHTML=setupView();return}
  if(!ui.user){app.innerHTML=loginView();return}
  if(ui.tab==='equipe'&&ui.user.role!=='admin')ui.tab='venda';
  const views={venda:viewVenda,estoque:viewEstoque,calendario:viewCalendario,vendas:viewRelatorios,equipe:viewEquipe};
  if(camState&&(!ui.modal||ui.modal.type!=='cam'))stopCam();
  app.innerHTML=shell(views[ui.tab]())+(ui.modal?modalView():'');
  paintTip();
  if(ui.tab==='venda'&&dlvOn())paintMap();
  if(ui.modal&&ui.modal.type==='product')updateMargin();
  if(ui.modal){const f=$('.modal [data-first]');if(f)f.focus()}
  else if(wasModal&&retSel){let r=null;try{r=document.querySelector(retSel)}catch(e){}if(r)r.focus()}
  else if(ui.tab==='venda'&&window.matchMedia&&matchMedia('(pointer:fine)').matches){const s=$('#scan');if(s)s.focus()}
  wasModal=!!ui.modal;
}
function softRefresh(){
  /* enquanto o dedo arrasta sobre o gráfico ou o gráfico tem o foco, não redesenha a tela */
  if(!ready||ui.busy||chartPtr)return;
  if(!ui.user){const p=$('#pin');if(p&&p.value)return;render();return}
  ui.user=db.users.find(u=>u.id===ui.user.id)||null;
  if(!ui.user){render();return}
  /* se o dono mudou as permissões, a tela refaz os botões e campos */
  const sig=JSON.stringify(permsOf(ui.user));if(sig!==permSig){permSig=sig;if(!ui.modal){render();return}}
  if(ui.modal)return;
  if(ui.tab==='venda'){const l=$('#plist');if(l)l.innerHTML=plist();const c=$('#cats');if(c)c.innerHTML=catChips();const t=document.querySelector('.todaychip');if(t)t.outerHTML=todayChip();return}
  const ae=document.activeElement;
  if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;
  if(ae&&ae.classList&&ae.classList.contains('chart'))return;

function imgFromFile(file){
  return new Promise((resolve,reject)=>{
    if(!/^image\//.test(file.type))return reject(new Error('tipo'));
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('leitura'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>reject(new Error('imagem'));
      im.onload=()=>{
        const k=Math.min(1,480/Math.max(im.naturalWidth,im.naturalHeight));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
        const x=c.getContext('2d');x.fillStyle='#FFFFFF';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        let q=0.86,d=c.toDataURL('image/jpeg',q);
        while(d.length>220000&&q>0.5){q-=0.1;d=c.toDataURL('image/jpeg',q)}
        resolve(d);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* busca em linguagem simples: "até 100", "acima de 50", "sem estoque", "estoque baixo", categoria e palavras */
const STOP=['de','da','do','com','em','por','para','uma','um','ate','sem','r'];
function parseQuery(raw){
  let t=norm(raw).replace(/\s+/g,' ').trim();
  const q={max:null,min:null,out:false,low:false,cat:null,words:[],filters:[]};
  t=t.replace(/\b(?:ate|abaixo de|menos de|no maximo)\s+(?:r\$\s*)?(\d+(?:[.,]\d+)?)/g,(m,v)=>{q.max=num(v);return ' '});
  t=t.replace(/\b(?:acima de|a partir de|mais de|no minimo)\s+(?:r\$\s*)?(\d+(?:[.,]\d+)?)/g,(m,v)=>{q.min=num(v);return ' '});
  t=t.replace(/\bsem estoque\b/g,()=>{q.out=true;return ' '});
  t=t.replace(/\b(?:estoque baixo|pouco estoque|acabando)\b/g,()=>{q.low=true;return ' '});
  [...new Set(db.products.map(p=>p.cat).filter(Boolean))].forEach(c=>{
    const n=norm(c).trim();if(!n||q.cat)return;
    const re=new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
    if(re.test(t)){q.cat=c;t=t.replace(re,' ')}
  });
  q.words=t.split(' ').filter(w=>w.length>1&&!STOP.includes(w));
  if(q.max!=null)q.filters.push('até '+brl(q.max));
  if(q.min!=null)q.filters.push('acima de '+brl(q.min));
  if(q.out)q.filters.push('sem estoque');
  if(q.low)q.filters.push('estoque baixo');
  if(q.cat)q.filters.push('categoria '+q.cat);
  return q;
}
function matchQ(p,q){
  const pr=effPrice(p);
  if(q.max!=null&&pr>q.max)return false;
  if(q.min!=null&&pr<q.min)return false;
  if(q.out&&p.stock>0)return false;
  if(q.low&&!(p.stock<=p.min))return false;
  if(q.cat&&norm(p.cat)!==norm(q.cat))return false;
  if(q.words.length){const hay=norm([p.name,p.brand,p.code,p.cat,p.vol].join(' '));if(!q.words.every(w=>hay.includes(w)))return false}
  return true;
}

let camState=null;
function stopCam(){if(!camState)return;clearInterval(camState.timer);try{camState.stream.getTracks().forEach(t=>t.stop())}catch(e){}camState=null}
async function camScan(){
  if(!('BarcodeDetector' in window)){toast('Este navegador não lê código pela câmera. Use o leitor USB ou digite o código.','bad');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('A câmera não está disponível neste aparelho.','bad');return}
  let det=null;try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']})}catch(e){det=null}
  if(!det){toast('Leitura pela câmera não é suportada aqui. Use o leitor USB ou digite o código.','bad');return}
  let stream=null;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})}
  catch(e){toast('Permita o uso da câmera para ler o código.','bad');return}
  stopCam();
  ui.modal={type:'cam'};render();
  const v=$('#camvid');
  if(!v){stream.getTracks().forEach(t=>t.stop());ui.modal=null;render();return}
  v.srcObject=stream;
  try{await v.play()}catch(e){}
  camState={stream:stream,timer:null,busy:false};
  camState.timer=setInterval(async()=>{
    const cur=$('#camvid');if(!cur||!camState||camState.busy)return;
    camState.busy=true;
    try{
      const r=await det.detect(cur);
      if(r&&r.length&&camState){const code=r[0].rawValue;stopCam();ui.modal=null;render();const sc=$('#scan');if(sc){sc.value=code;scanAdd()}}
    }catch(e){}
    finally{if(camState)camState.busy=false}
  },300);
}

async function calcRoute(a){
  const d=ui.dlv,stale=()=>ui.dlv!==d||normAddr(d.addr)!==a;
  if(stale())return;
  const s=db.store||{};
  if(s.lat==null||s.lng==null){d.status='A loja ainda não tem endereço no mapa. Peça ao dono para cadastrar em Equipe e loja.';updateDelivery();return}
  let to=null;
  try{to=await geocode(a)}catch(e){to=undefined}
  if(stale())return;
  if(to===undefined){d.status='Sem conexão com o mapa. Confira a internet e continue digitando o endereço.';updateDelivery();return}
  if(!to){d.status='Não encontrei esse endereço. Confira rua, número e cidade.';updateDelivery();paintMap();return}
  let rt=null;
  try{rt=await routeBetween({lat:s.lat,lng:s.lng},to)}catch(e){rt=null}
  if(stale())return;
  if(!rt)rt=straightRoute({lat:s.lat,lng:s.lng},to);
  d.geo=to;
  d.route={km:rt.km,min:rt.min,fee:deliveryFee(rt.km),est:rt.est,coords:rt.coords};
  d.status=rt.est?'Endereço encontrado. Sem rota pelas ruas agora, a distância é estimada em linha reta.':'Endereço encontrado. Rota calculada.';
  updateDelivery();paintMap();
}
/* busca o endereço no OpenStreetMap (Nominatim); resultados ficam guardados nesta sessão */
async function geocode(q){
  const k=norm(q);
  if(geoCache.has(k))return geoCache.get(k);
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q));
  if(!r.ok)throw new Error('geo');
  const j=await r.json(),h=j&&j[0];
  const hit=h?{lat:Number(h.lat),lng:Number(h.lon),label:h.display_name||q}:null;
  geoCache.set(k,hit);return hit;
}
/* rota de carro pelas ruas (OSRM); devolve km, minutos e o desenho da rota */
async function routeBetween(a,b){
  const url='https://router.project-osrm.org/route/v1/driving/'+a.lng+','+a.lat+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson';
  const r=await fetch(url);if(!r.ok)throw new Error('rota');
  const j=await r.json(),x=j&&j.routes&&j.routes[0];
  if(!x)throw new Error('rota');
  return{km:x.distance/1000,min:x.duration/60,est:false,coords:x.geometry.coordinates.map(c=>[c[1],c[0]])};
}
/* sem rota pelas ruas: distância em linha reta, com 30% a mais porque as ruas não são retas */
function straightRoute(a,b){
  const R=6371,t=v=>v*Math.PI/180,dLat=t(b.lat-a.lat),dLng=t(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLng/2)**2;
  const km=2*R*Math.asin(Math.sqrt(h))*1.3;
  return{km:km,min:km/25*60,est:true,coords:[[a.lat,a.lng],[b.lat,b.lng]]};
}
/* Leaflet carrega só quando há entrega; se não carregar, o app segue só com a distância */
function loadMap(){
  if(window.L)return Promise.resolve(window.L);
  if(!leafP){
    leafP=new Promise((res,rej)=>{
      const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(css);
      const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
      const t=setTimeout(()=>rej(new Error('lento')),8000);
      sc.onload=()=>{clearTimeout(t);window.L?res(window.L):rej(new Error('mapa'))};
      sc.onerror=()=>{clearTimeout(t);rej(new Error('mapa'))};
      document.head.appendChild(sc);
    }).catch(e=>{leafP=null;throw e});
  }
  return leafP;
}
/* desenha a loja, o cliente e a rota; refaz o mapa sempre que o bloco de entrega é redesenhado */
async function paintMap(){
  const el=$('#dmap');if(!el)return;
  if(dmapObj){try{dmapObj.remove()}catch(e){}dmapObj=null}
  const d=ui.dlv,s=db.store||{},hasStore=s.lat!=null&&s.lng!=null;
  if(!hasStore&&!d.geo){el.innerHTML='<span class="dmap-msg">O mapa aparece quando o endereço do cliente for encontrado.</span>';return}
  let L=null;try{L=await loadMap()}catch(e){L=null}
  if($('#dmap')!==el)return;
  if(!L){el.innerHTML='<span class="dmap-msg">Mapa indisponível agora. A distância e a taxa continuam sendo calculadas.</span>';return}
  el.innerHTML='';
  const map=L.map(el,{attributionControl:true});
  dmapObj=map;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const pts=[];
  if(hasStore){pts.push([s.lat,s.lng]);L.circleMarker([s.lat,s.lng],{radius:9,color:'#17120A',weight:2,fillColor:'#C9A24B',fillOpacity:1}).bindTooltip('Loja').addTo(map)}
  if(d.geo){pts.push([d.geo.lat,d.geo.lng]);L.circleMarker([d.geo.lat,d.geo.lng],{radius:9,color:'#17120A',weight:2,fillColor:'#EAD08C',fillOpacity:1}).bindTooltip('Cliente').addTo(map)}
  if(d.route&&d.route.coords&&d.route.coords.length){
    L.polyline(d.route.coords,{color:'#EAD08C',weight:5,opacity:.9,dashArray:d.route.est?'8 8':null}).addTo(map);
    d.route.coords.forEach(c=>pts.push(c));
  }
  if(pts.length>1)map.fitBounds(pts,{padding:[24,24]});else map.setView(pts[0]||[-14.2,-51.9],pts[0]?15:3);
}

function addProduct(p){
  if(!can('sell')){toast(NO_PERM('fazer vendas'),'bad');return false}
  if(p.active===false){toast('Produto inativo. Ative no Estoque para vender.','bad');return false}
  const it=ui.cart.find(i=>i.id===p.id);const have=it?it.qty:0;
  if(p.stock-have<=0){toast('Sem estoque: '+p.name,'bad');return false}
  if(it)it.qty++;else ui.cart.push({id:p.id,name:p.name,qty:1,price:effPrice(p),cost:p.cost});
  announce(p.name+' adicionado. Cupom com '+ui.cart.reduce((a,i)=>a+i.qty,0)+' itens.');

}

async function finalizeSale(){
  if(!ui.cart.length)return toast('Adicione ao menos um item.','bad');
  if(!ui.age)return toast('Confirme que o cliente tem 18 anos ou mais.','bad');
  if(!can('sell'))return toast(NO_PERM('fazer vendas'),'bad');
  if(dlvOn()&&!dlvReady()){
    if(!normAddr(ui.dlv.addr))return fieldErr('Digite o endereço do cliente para a entrega.','dlv-addr');
    return fieldErr('A taxa de entrega ainda não foi calculada. Confira o endereço do cliente.','dlv-addr');
  }
  const t=cartTotals();let recv=0,change=0;
  if(ui.pay==='Dinheiro'){recv=num(ui.received);if(recv&&recv<t.total)return toast('O valor recebido é menor que o total.','bad');change=recv?Math.round((recv-t.total)*100)/100:0}
  for(const i of ui.cart){const p=db.products.find(x=>x.id===i.id);if(!p||p.stock<i.qty)return toast('Estoque insuficiente: '+i.name,'bad')}
  const seller=db.users.find(u=>u.id===ui.seller)||ui.user;
  const dv=dlvOn()?{name:ui.dlv.name.trim(),addr:normAddr(ui.dlv.addr),phone:ui.dlv.phone.trim(),km:Math.round(ui.dlv.route.km*10)/10,min:Math.round(ui.dlv.route.min),est:!!ui.dlv.route.est}:null;
  const n=await reserveNumber();
  const sale={id:uid(),n:n,ts:Date.now(),sellerId:seller.id,sellerName:seller.name,
    items:ui.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,cost:Number(i.cost)||0})),
    subtotal:t.subtotal,discount:t.discount,fee:t.fee,total:t.total,pay:ui.pay,received:recv,change:change,canceled:false,delivery:dv};
  put('sales',sale);
  ui.cart=[];ui.discount='';ui.received='';ui.age=false;ui.dlv=newDlv();
  ui.modal={type:'receipt',id:sale.id,fresh:true};
  render();
  if(canPrint&&prefs.autoprint)setTimeout(()=>printReceipt(sale.id),250);
}

document.addEventListener('keydown',e=>{
  if(e.target.id==='scan'&&e.key==='Enter'){e.preventDefault();scanAdd()}
  /* gráfico com foco: setas escolhem a barra, Home/End vão às pontas, Esc limpa */
  if(e.target.classList&&e.target.classList.contains('chart')&&!ui.modal&&repCache){
    const n=repCache.B.length,cur=curSel()!=null?curSel():-1;let nx=null;
    if(e.key==='ArrowRight'||e.key==='ArrowUp')nx=Math.min(n-1,cur+1);
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown')nx=Math.max(0,cur<0?n-1:cur-1);
    else if(e.key==='Home')nx=0;
    else if(e.key==='End')nx=n-1;
    else if(e.key==='Escape'){e.preventDefault();clearBar();return}
    if(nx!=null){e.preventDefault();selectBar(nx)}
  }
  if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}
  /* foco preso dentro do modal enquanto ele estiver aberto */
  if(e.key==='Tab'&&ui.modal){
    const box=$('.modal');if(!box)return;
    const f=[...box.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled])')];
    if(!f.length)return;
    const first=f[0],last=f[f.length-1],a=document.activeElement;
    if(e.shiftKey&&(a===first||!box.contains(a))){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&(a===last||!box.contains(a))){e.preventDefault();first.focus()}
  }
});

  }else if(k==='saveProduct'){
    if(!can('products'))return toast(NO_PERM('editar produtos'),'bad');
    const code=(fd.code||'').trim(),name=(fd.name||'').trim(),price=num(fd.price),cost=num(fd.cost),promo=num(fd.promo),min=Math.max(0,Math.floor(num(fd.min)));
    if(!name)return fieldErr('Informe o nome do produto.','f-name');
    if(!/^[0-9]{8,14}$/.test(code))return fieldErr('O código de barras precisa ter de 8 a 14 números.','f-code');
    if(price<=0)return fieldErr('Informe o preço de venda.','f-price');
    if(promo>0&&promo>=price)return fieldErr('O preço promocional precisa ser menor que o preço de venda.','f-promo');
    if(fd.promoOn&&!(promo>0))return fieldErr('Para ativar a promoção, informe o preço promocional.','f-promo');
    const id=ui.modal.id;
    if(db.products.some(p=>p.code===code&&p.id!==id))return fieldErr('Esse código já pertence a outro produto.','f-code');
    const data={code:code,name:name,brand:(fd.brand||'').trim(),sub:(fd.sub||'').trim(),cat:(fd.cat||'').trim()||'Outros',vol:(fd.vol||'').trim(),sku:(fd.sku||'').trim(),supp:(fd.supp||'').trim(),cost:cost,price:price,promo:promo>0?promo:0,promoOn:!!fd.promoOn&&promo>0,min:min,last:fd.last||'',notes:(fd.notes||'').trim(),active:!!fd.active,img:ui.modal.img||''};
    if(id){const p=db.products.find(x=>x.id===id);put('products',Object.assign({},p,data))}
    else put('products',Object.assign({id:uid(),stock0:Math.max(0,Math.floor(num(fd.stock)))},data));
    ui.modal=null;render();toast('Produto salvo.','ok');
  }else if(k==='saveMove'){
    if(!can('stock'))return toast(NO_PERM('dar entrada ou ajuste no estoque'),'bad');
    const p=db.products.find(x=>x.id===ui.modal.id);const q=Math.floor(num(fd.qty));
    if(!p)return;
    if(q<0||(fd.type!=='set'&&q<=0))return fieldErr('Informe uma quantidade válida.','m-qty');
    let delta=0;
    if(fd.type==='in')delta=q;
    else if(fd.type==='out'){if(q>p.stock)return fieldErr('A quantidade é maior que o estoque atual.','m-qty');delta=-q}
    else delta=q-p.stock;
    if(delta!==0){
      const isIn=fd.type==='in',ucost=isIn?num(fd.ucost):0;
      put('adjusts',{id:uid(),pid:p.id,delta:delta,kind:fd.type,ts:Date.now(),by:ui.user.name,supp:isIn?(fd.supp||'').trim():'',unitCost:ucost});
      if(isIn&&fd.upd&&ucost>0&&ucost!==(Number(p.cost)||0))put('products',Object.assign({},p,{cost:ucost}));
    }
    ui.modal=null;render();toast('Estoque atualizado.','ok');
  }else if(k==='addUser'){
    const name=(fd.name||'').trim();
    if(!name)return fieldErr('Informe o nome.','u-name');
    if(!/^[0-9]{4,8}$/.test(fd.pin||''))return fieldErr('O PIN precisa ter de 4 a 8 números.','u-pin');
    if(db.users.some(u=>u.name.toLowerCase()===name.toLowerCase()))return fieldErr('Já existe alguém com esse nome.','u-name');
    const perms={};PERMS.forEach(x=>{perms[x[0]]=!!fd[x[0]]});
    put('users',{id:uid(),name:name,pinH:hpin(fd.pin),role:fd.role==='admin'?'admin':'vendedor',comm:Math.max(0,num(fd.comm)),perms:perms});
    render();toast('Funcionário adicionado.','ok');
  }else if(k==='saveStore'){
    if(!ui.user||ui.user.role!=='admin')return;
    db.store=Object.assign({},db.store,{name:(fd.name||'').trim()||db.store.name,info:(fd.info||'').trim(),minMargin:Math.min(100,Math.max(0,num(fd.minMargin)||0))});putStore();
    render();toast('Dados da loja salvos.','ok');
  }else if(k==='saveDelivery'){
    if(!ui.user||ui.user.role!=='admin')return;
    const addr=normAddr(fd.addr),km=num(fd.km),fee=num(fd.fee),per=num(fd.per);
    if(!(km>=0)||!(fee>=0)||!(per>=0))return toast('Confira os valores da taxa.','bad');
    const changed=addr!==normAddr(db.store.addr)||db.store.lat==null;
    db.store=Object.assign({},db.store,{addr:addr,dlvKm:km,dlvFee:fee,dlvPerKm:per});
    let msg='Entregas salvas.',kind='ok';
    if(changed){
      if(!addr){db.store.lat=null;db.store.lng=null}
      else{
        let g=null;try{g=await geocode(addr)}catch(e){g=undefined}
        if(g===undefined){db.store.lat=null;db.store.lng=null;msg='Entregas salvas, mas sem conexão para localizar a loja. Salve de novo com a internet.';kind='bad'}
        else if(!g){db.store.lat=null;db.store.lng=null;msg='Não encontrei o endereço da loja. Confira rua, número e cidade.';kind='bad'}
        else{db.store.lat=g.lat;db.store.lng=g.lng}
      }
    }
    putStore();render();toast(msg,kind);
  }else if(k==='savePerms'){
    if(!ui.user||ui.user.role!=='admin')return;
    const u=db.users.find(x=>x.id===f.dataset.id);if(!u||u.role==='admin')return;
    const perms={};PERMS.forEach(x=>{perms[x[0]]=!!fd[x[0]]});
    put('users',Object.assign({},u,{perms:perms}));
    ui.modal=null;render();toast('Permissões salvas.','ok');
  }
});

render();
initStorage();
})();

/* barra do topo: encolhe ao descer a página e volta ao normal ao subir */
(()=>{let raf=0;const body=document.body;
  const sync=()=>{raf=0;const y=window.scrollY||document.documentElement.scrollTop||0;
    if(!body.classList.contains('compact')){if(y>96)body.classList.add('compact')}
    else if(y<24)body.classList.remove('compact')};
  const ask=()=>{if(!raf)raf=requestAnimationFrame(sync)};
  window.addEventListener('scroll',ask,{passive:true});
  window.addEventListener('resize',ask);
  sync();
})();
</script>
