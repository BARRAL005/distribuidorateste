<title>Balcão Adega</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: menu lateral preto à esquerda (abas embaixo no celular). Nova venda: bipador no topo, vitrine de garrafas à esquerda, cupom de papel à direita.
   Identidade fixa em preto e dourado. As categorias de destilado usam tons de metal e pátina, só nas garrafas e nos marcadores. */
:root{
  --bg:#0A0A0B; --surface:#141415; --surface2:#1C1B1A; --field:#0E0E0F;
  --fg:#F1EBDD; --muted:#A29A89; --line:#2B2926; --line-gold:rgba(201,162,75,.38);
  --gold:#C9A24B; --gold-hi:#EAD08C; --gold-lo:#98772F; --gold-soft:rgba(201,162,75,.14); --on-gold:#17120A;
  --side:#070708; --side-on:rgba(201,162,75,.12);
  --ok:#86CCA0; --ok-soft:#142419; --warn:#E8923F; --warn-soft:#2E1E0F; --bad:#EE8573; --bad-soft:#331712;
  --paper:#F7F1E1; --paper-fg:#1B1914; --paper-line:#C9C0A8; --paper-muted:#6A6454;
  --shadow:rgba(0,0,0,.6); --shade:rgba(0,0,0,.72);
  --cat-cachaca:#D9B04F; --cat-vodka:#BCC4CC; --cat-whisky:#A9733A; --cat-gin:#7FB0A2; --cat-tequila:#A8B260;
  --cat-rum:#B5533F; --cat-licor:#9A78A8; --cat-aperitivo:#D0584A; --cat-conhaque:#C98652; --cat-outros:#8C877B;
  --font-d:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-b:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1100px 520px at 50% -200px,rgba(201,162,75,.11),transparent 70%) no-repeat,var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-block:12px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-d);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:25px;margin-bottom:14px;line-height:1.15}
h3{font-size:20px;margin-bottom:12px;line-height:1.15}
.mono{font-family:var(--font-b);font-variant-numeric:tabular-nums}
.lin{font-variant-numeric:lining-nums tabular-nums}
small,.hint{color:var(--muted);font-size:13px}
.hint{margin:8px 0 0}
label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
input::placeholder{color:#8C8571}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--gold);flex:none;margin-top:1px}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
.btn{font:inherit;font-weight:600;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 16px;min-height:44px;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,color .2s,box-shadow .2s,transform .12s}
.btn:active{transform:translateY(1px)}
.btn:hover{border-color:var(--line-gold);color:var(--gold-hi)}
.btn.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:var(--on-gold);border-color:transparent;font-weight:700;box-shadow:0 10px 22px -14px rgba(201,162,75,.85),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri:hover{filter:brightness(1.07);color:var(--on-gold)}
.btn.danger{color:var(--bad);border-color:rgba(238,133,115,.5);background:transparent}
.btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--gold-hi);border-color:transparent}
.btn.sm{min-height:44px;padding:4px 14px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0) 42%),var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0;box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 26px 44px -38px rgba(0,0,0,.95)}
.fld{margin-top:14px}
.fld:first-child{margin-top:0}

/* estrutura */
.brand{display:flex;align-items:center;gap:12px;padding:0 6px;min-width:0}
.brand b{font-family:var(--font-d);font-size:19px;font-weight:700;line-height:1.15;overflow-wrap:anywhere;color:var(--gold-hi)}
.brand .btl{height:36px;flex:none}
.nv{display:flex;align-items:center;gap:12px;width:100%;font:inherit;font-weight:500;color:var(--muted);background:none;border:0;border-radius:10px;padding:12px;cursor:pointer;text-align:left}
.nv:hover{color:var(--fg)}
.nv svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv[aria-current=page]{background:var(--side-on);color:var(--gold-hi)}
.av{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-gold);color:var(--gold-hi);display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:16px;flex:none}
.main{min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:clamp(28px,3.6vw,40px);line-height:1.05;letter-spacing:-.025em}
.ph p{margin:8px 0 0;color:var(--muted)}
.btl{width:auto;display:block}

/* barra de navegação no topo, com brilho que passa pelo layout */
/* barra fixa no topo: encolhe ao descer a página e volta ao normal ao subir (body.compact, ligado pelo script) */
:root{--tb-full:136px;--tb-h:var(--tb-full)}
html{scroll-padding-top:calc(var(--tb-full) + 24px)}
.shell{max-width:1280px;margin:0 auto}
.tb-pad{height:calc(var(--tb-full) + 16px)}
.topbar{position:fixed;top:12px;left:0;right:0;margin:0 auto;width:min(1280px,calc(100% - 32px));height:var(--tb-h);z-index:20;padding:0 18px;border-radius:20px;border:1px solid var(--line-gold);background:linear-gradient(180deg,rgba(30,25,16,.94),rgba(12,10,8,.94));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 18px 40px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(234,208,140,.14);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand user" "nav nav";grid-template-rows:auto auto;align-content:center;column-gap:16px;transition:height .32s cubic-bezier(.2,.7,.2,1),box-shadow .3s ease}
.topbar::before{content:"";position:absolute;top:-30%;bottom:-30%;left:-45%;width:30%;background:linear-gradient(100deg,transparent,rgba(234,208,140,.2),transparent);transform:skewX(-18deg);animation:barSweep 6.5s ease-in-out infinite;pointer-events:none}
.tb-row{display:contents}
.topbar .brand{grid-area:brand;padding:0;min-width:0;justify-self:start}
.topbar .logo{height:40px}
.topbar .brand b{font-size:19px;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi),var(--gold),var(--gold-hi),var(--gold-lo));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:goldFlow 7s ease-in-out infinite alternate}
.tb-user{grid-area:user;display:flex;align-items:center;gap:10px;justify-self:end;min-width:0}
.tb-who{line-height:1.2}
.tb-who b{display:block}
.tb-who small{font-size:12px;color:var(--muted)}
.sidenav{grid-area:nav;display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;margin-top:12px;position:relative;padding-top:12px;border-top:1px solid var(--line);min-width:0}
.topbar .nv{width:auto;flex-direction:row;padding:10px 16px;border-radius:12px;border:1px solid transparent;position:relative;overflow:hidden;transition:background .25s,border-color .25s,color .25s,box-shadow .25s}
.topbar .nv:hover{border-color:var(--line-gold);background:var(--gold-soft)}
.topbar .nv[aria-current=page]{color:var(--gold-hi);background:linear-gradient(180deg,rgba(234,208,140,.2),rgba(201,162,75,.08));border-color:var(--line-gold);box-shadow:0 0 24px -8px rgba(201,162,75,.75)}
.topbar .nv[aria-current=page]::after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);background-size:200% 100%;animation:goldFlow 2.6s ease-in-out infinite alternate}
.sheen{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.sheen::before{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:42%;background:linear-gradient(100deg,transparent 0%,rgba(255,236,190,.085) 50%,transparent 100%);transform:translateX(-130%) skewX(-14deg);animation:sheenPass 10s cubic-bezier(.45,.05,.35,1) infinite;will-change:transform}
@media (max-width:820px){
  :root{--tb-full:132px}
  body{padding-top:0}
  body.compact{--tb-h:72px}
  .topbar{top:0;left:0;right:0;width:auto;margin:0;border-radius:0 0 22px 22px;padding:10px 12px 0;grid-template-columns:minmax(0,1fr);grid-template-areas:"row" "nav";grid-template-rows:auto auto;align-content:start;row-gap:10px;column-gap:0}
  .tb-row{display:flex;grid-area:row;align-items:center;justify-content:space-between;gap:10px;min-width:0}
  .topbar .brand{min-width:0;flex:1 1 auto}
  .topbar .brand b{display:block;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
  .topbar .logo{height:32px}
  .tb-user .cloud,.tb-who{display:none}
  .sidenav{margin-top:0;padding-top:10px;gap:3px;justify-content:space-between}
  .topbar .nv{flex:1 1 auto;flex-direction:column;justify-content:center;gap:4px;font-size:10.5px;padding:8px 0;text-align:center;min-width:0;line-height:1.15}
  .topbar .nv svg{width:18px;height:18px}
  .topbar .nv span{overflow-wrap:normal;word-break:normal;hyphens:none}
  .topbar .nv[aria-current=page]::after{left:20%;right:20%}
  /* tabelas no celular: a coluna do produto fica fixa ao rolar para os lados */
  .tw{position:relative}
  .tw td:has(>.pn),.tw th:first-child{min-width:190px}
  .tw td:has(>.pn){position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:8px 0 12px -10px rgba(0,0,0,.9)}
  body.compact .tb-row{display:none}
  body.compact .sidenav{padding-top:0;border-top:0}
}
@media (max-width:360px){.topbar .nv{font-size:10px;letter-spacing:-.02em}.sidenav{gap:2px}}
/* modo compacto no computador (ao descer a página): tudo em uma linha */
@media (min-width:821px){
  body.compact{--tb-h:66px}
  body.compact .topbar{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand nav user";grid-template-rows:auto;column-gap:12px}
  body.compact .topbar .logo{height:30px}
  body.compact .topbar .brand b{font-size:16px}
  body.compact .tb-user .cloud,body.compact .tb-who{display:none}
  body.compact .sidenav{margin-top:0;padding-top:0;border-top:0}
  body.compact .topbar .nv{padding:8px 12px}
  @media (max-width:1100px){body.compact .topbar .brand b{display:none}}
}

/* nova venda */
.sale{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-areas:"scan cart" "prods cart";gap:16px 24px;align-items:start}
.a-scan{grid-area:scan;min-width:0}
.a-cart{grid-area:cart;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding:0 4px 14px;min-width:0}
.a-prods{grid-area:prods;min-width:0}
@media (max-width:1020px){
  .sale{grid-template-columns:minmax(0,1fr);grid-template-areas:"scan" "cart" "prods"}
  .a-cart{position:static;max-height:none;overflow:visible;padding:0 0 14px}
}
.scan{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-gold);border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 18px 30px -26px rgba(201,162,75,.55);transition:border-color .15s,box-shadow .15s}
.scan:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.scan.hit{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.bars{width:30px;height:24px;flex:none;border-radius:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 2px,transparent 2px 4px,var(--gold) 4px 5px,transparent 5px 8px,var(--gold) 8px 11px,transparent 11px 13px)}
.scan input{border:0;background:transparent;font-family:var(--font-b);font-size:18px;min-height:46px;padding:0;flex:1;min-width:0;box-shadow:none}
.scan input:focus{box-shadow:none}
.scan .btn{min-height:46px}
.shelfbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 14px}
.shelfbar input{flex:1 1 200px;min-width:0;width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-weight:500;font-size:14px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--line-gold)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-hi)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{font:inherit;color:var(--fg);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 22px 36px -24px rgba(201,162,75,.7)}
.t-art{display:flex;justify-content:center;align-items:flex-end;height:112px;padding-top:12px;background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--c) 22%,var(--surface)),var(--surface2))}
.t-art .btl{height:92px}
.t-body{display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px;flex:1}
.t-cat{font-size:12px;color:var(--muted)}
.t-name{font-weight:600;font-size:14px;line-height:1.25;min-height:2.5em;overflow-wrap:anywhere}
.t-foot{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:auto;padding-top:6px}
.t-price{font-family:var(--font-d);font-weight:700;font-size:19px;color:var(--gold-hi);font-variant-numeric:lining-nums}
.t-stock{font-size:12px;color:var(--muted)}
.t-stock.low{color:var(--warn);font-weight:700}
.tile[disabled]{cursor:not-allowed;opacity:.5;filter:grayscale(.9)}
.tile[disabled]:hover{transform:none;border-color:var(--line)}

/* cupom */
.receipt{position:relative;background:var(--paper);color:var(--paper-fg);font-family:var(--font-m);font-size:13px;padding:20px 18px 18px;margin-bottom:22px;border-radius:6px 6px 0 0;box-shadow:0 14px 28px -12px var(--shadow)}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:var(--paper);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.rc-brand{font-family:var(--font-d);font-weight:700;font-size:19px;text-align:center;overflow-wrap:anywhere;line-height:1.1}
.rc-sub{text-align:center;color:var(--paper-muted);font-size:12px;margin:4px 0 12px}
.rc-row{display:flex;justify-content:space-between;gap:10px;color:var(--paper-muted);font-size:12px}
.rc-sep{border-top:1px dashed var(--paper-line);margin:12px 0}
.rc-empty{text-align:center;color:var(--paper-muted);padding:20px 8px;margin:0}
.ri{padding:8px 0;border-bottom:1px dotted var(--paper-line)}
.ri:last-child{border-bottom:0}
.ri-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ri-name{font-family:var(--font-b);font-weight:600;font-size:14px;overflow-wrap:anywhere}
.ri-bot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--paper-muted);font-size:12px}
.ri-bot .unit{flex:1}
.qty{display:flex;align-items:center;gap:4px}
.qty b{min-width:24px;text-align:center;font-weight:500;color:var(--paper-fg);font-size:14px}
.qb{font:inherit;font-size:16px;width:44px;height:44px;border-radius:8px;border:1px solid var(--paper-line);background:transparent;color:var(--paper-fg);cursor:pointer;padding:0;line-height:1}
.qb:hover{background:var(--paper-line)}
.rc-sum{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.rc-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding-top:12px;border-top:2px solid var(--paper-fg)}
.rc-total span{font-family:var(--font-b);font-weight:700;font-size:15px}
.rc-total b{font-family:var(--font-d);font-variant-numeric:lining-nums;font-size:clamp(26px,3vw,34px);font-weight:700;overflow-wrap:anywhere;line-height:1}
.checkout{padding:18px}
.pays{display:flex;flex-wrap:wrap;gap:6px}
.pays .chip.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));border-color:transparent;color:var(--on-gold);font-weight:700}
.check{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px}
.check label{font-size:14px;font-weight:400;color:var(--fg);margin:0;min-height:44px;display:flex;align-items:center}
.fin{width:100%;margin-top:16px;min-height:56px;font-size:17px;border-radius:12px}

/* etiquetas e tabelas */
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.bad{color:var(--bad)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-gold);font-weight:600}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover td{background:rgba(201,162,75,.035)}
td.r,th.r{text-align:right}
tr.cx td{opacity:.7;text-decoration:line-through}
tr.cx td.keep{text-decoration:none;opacity:1}
.pn{display:flex;align-items:center;gap:12px;min-width:0}
.pn .ico{width:38px;height:46px;border-radius:8px;background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--c) 22%,var(--surface)),var(--surface2));display:flex;align-items:flex-end;justify-content:center;padding-top:5px;flex:none}
.pn .ico .btl{height:36px}
.pn b{font-weight:600;overflow-wrap:anywhere}
.pn small{display:block}
.gauge{height:5px;border-radius:3px;background:var(--line);overflow:hidden;width:96px;margin-top:6px;margin-left:auto}
.gauge i{display:block;height:100%;background:var(--ok);border-radius:3px}
.gauge.low i{background:var(--warn)}
.gauge.out i{background:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input{flex:1 1 220px;min-width:0;width:auto}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.empty{color:var(--muted);padding:20px 0;text-align:center;margin:0}

/* vendas */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{font:inherit;font-weight:600;font-size:14px;border:0;background:none;color:var(--muted);padding:8px 16px;border-radius:9px;cursor:pointer;min-height:44px}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:var(--on-gold)}
.hero{display:flex;flex-wrap:wrap;gap:20px 56px;align-items:flex-end;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--line-gold)}
.hero .big{display:block;font-family:var(--font-d);font-variant-numeric:lining-nums;font-weight:700;font-size:clamp(40px,6.5vw,60px);line-height:1;overflow-wrap:anywhere;
  color:var(--gold);background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:flex;flex-wrap:wrap;gap:16px 40px}
.stats b{display:block;font-family:var(--font-d);font-variant-numeric:lining-nums;font-size:24px;font-weight:700;line-height:1.1}
.rank{margin-bottom:16px}
.rank:last-child{margin-bottom:0}
.rk-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rk-top b{font-weight:600;overflow-wrap:anywhere}
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:7px 0 4px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--gold))}

/* modal */
.overlay{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:40;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line-gold);border-radius:20px;padding:24px;width:100%;max-width:500px;margin:auto;box-shadow:0 40px 80px -40px rgba(0,0,0,.95)}
@media (max-width:480px){.modal{padding:18px 16px}}
.modal .row.end{margin-top:20px}
.paper{background:var(--paper);color:var(--paper-fg);font-family:var(--font-m);font-size:clamp(8px,calc((100vw - 94px) / 33),12px);line-height:1.35;padding:16px 14px;margin:0 0 14px;border-radius:6px;overflow-x:auto;white-space:pre;max-width:100%}
.psel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.psel .lbl{margin:0}

/* entrada: login e primeiro acesso */
.auth{position:relative;min-height:calc(100vh - 24px);display:grid;place-items:center;padding:24px 0;isolation:isolate}
.auth-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(70% 55% at 50% -8%,rgba(201,162,75,.16),transparent 70%),radial-gradient(60% 50% at 50% 115%,rgba(201,162,75,.10),transparent 65%),var(--bg)}
.auth-bg .grid{position:absolute;inset:-64px;background-image:linear-gradient(rgba(201,162,75,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(201,162,75,.07) 1px,transparent 1px);background-size:56px 56px;-webkit-mask:radial-gradient(60% 60% at 50% 45%,#000,transparent 80%);mask:radial-gradient(60% 60% at 50% 45%,#000,transparent 80%);animation:gridMove 38s linear infinite}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.26;background:radial-gradient(circle,var(--gold-hi),var(--gold-lo) 70%);animation:float 22s ease-in-out infinite;will-change:transform}
.orb.o1{width:420px;height:420px;left:-120px;top:-120px}
.orb.o2{width:360px;height:360px;right:-100px;bottom:-140px;animation-duration:28s;animation-delay:-8s}
.spark{position:absolute;left:var(--x);top:var(--y);width:3px;height:3px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 8px 2px rgba(234,208,140,.45);opacity:0;animation:twinkle var(--d) ease-in-out var(--t) infinite}
.auth-card{position:relative;width:min(440px,100%);padding:34px 30px 30px;border-radius:22px;background:var(--surface);border:1px solid var(--line-gold);box-shadow:0 40px 90px -40px rgba(0,0,0,.9),0 0 60px -20px rgba(201,162,75,.25);animation:cardIn .8s cubic-bezier(.2,.7,.2,1) both}
.auth-card::before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent)}
.auth-head{text-align:center;margin-bottom:24px}
.logo-hero{display:block;height:128px;width:auto;margin:0 auto;border-radius:16px;box-shadow:0 0 0 1px var(--line-gold),0 0 46px -6px rgba(201,162,75,.35);animation:logoIn 1s .1s cubic-bezier(.2,.7,.2,1) both}
.auth-title{font-size:30px;line-height:1.1;margin-top:22px;letter-spacing:-.02em}
.auth-sub{color:var(--muted);margin:8px auto 0;max-width:30ch;font-size:14.5px}
.auth-form{display:flex;flex-direction:column}
.who-wrap{min-width:0}
.who-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.who{font:inherit;color:var(--fg);display:flex;align-items:center;gap:12px;text-align:left;padding:12px;min-height:62px;border-radius:14px;background:var(--field);border:1px solid var(--line);cursor:pointer;min-width:0;transition:border-color .2s,background .2s,transform .2s,box-shadow .25s}
.who:hover{transform:translateY(-1px);border-color:var(--line-gold)}
.who.on{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),transparent);box-shadow:0 0 0 1px var(--gold) inset,0 10px 30px -18px rgba(201,162,75,.7)}
.who-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--gold-hi);border:1px solid var(--line-gold);background:var(--surface2)}
.who.on .who-av{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));color:var(--on-gold);border-color:transparent}
.who-txt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.who-txt b{font-weight:600;overflow-wrap:anywhere}
.who-txt small{color:var(--muted)}
.pin-wrap{position:relative;margin-top:6px}
.pin-wrap input{height:54px;min-height:54px;font-size:22px;letter-spacing:.32em;font-family:var(--font-b);padding:0 56px 0 16px;border-radius:12px}
.pin-wrap input::placeholder{letter-spacing:.2em}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:hover,.eye[aria-pressed=true]{color:var(--gold-hi)}
.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pin-wrap.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
.pin-wrap.shake input{border-color:var(--bad)}
.auth-err:empty{display:none}
.auth-err:not(:empty){display:block;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bad-soft);border:1px solid rgba(238,133,115,.35);color:var(--bad);font-size:14px;font-weight:600;animation:fadeUp .3s ease both}
.btn-enter{position:relative;overflow:hidden;margin-top:18px;width:100%;min-height:54px;border:0;border-radius:14px;cursor:pointer;font:inherit;font-weight:700;font-size:16px;letter-spacing:.02em;color:var(--on-gold);background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s ease,box-shadow .25s ease,filter .25s ease}
.btn-enter::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s ease;pointer-events:none}
.btn-enter:hover{filter:brightness(1.05);box-shadow:0 14px 34px -12px rgba(201,162,75,.65)}
.btn-enter:hover::after{transform:translateX(120%)}
.btn-enter:active{transform:scale(.985)}
.btn-enter:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.btn-enter:disabled{cursor:progress;filter:none;box-shadow:none}
.btn-enter .spin{display:none;width:18px;height:18px;border-radius:50%;border:2px solid rgba(23,18,10,.25);border-top-color:var(--on-gold)}
.auth-form.busy .btn-enter .spin{display:inline-block;animation:spin .7s linear infinite}
.shell.enter .main{animation:shellIn .45s ease both}
@media (max-width:480px){
  .auth{place-items:start center;padding-top:8px}
  .auth-card{padding:26px 20px 22px;border-radius:18px}
  .logo-hero{height:104px}
  .auth-title{font-size:29px}
  .who-list{grid-template-columns:1fr 1fr}
  .pin-wrap input{font-size:20px}
}
@keyframes gridMove{to{transform:translate(56px,56px)}}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.08)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.9;transform:scale(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes logoIn{from{opacity:0;transform:scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shellIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sheenPass{0%{transform:translateX(-130%) skewX(-14deg)}45%,100%{transform:translateX(330%) skewX(-14deg)}}
@keyframes barSweep{0%{left:-45%}55%,100%{left:125%}}
@keyframes goldFlow{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .auth-bg .grid,.orb,.spark{animation:none!important}
  .spark{opacity:0}
  .sheen,.topbar::before{display:none}
  .topbar .nv[aria-current=page]::after{animation:none}
}

/* aviso */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--on-gold);padding:12px 18px;border-radius:14px;font-weight:700;z-index:50;box-shadow:0 18px 36px -18px rgba(0,0,0,.9);max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .15s}
.toast.show{opacity:1}
.toast.bad{background:var(--bad);color:#1F0804}
.toast.ok{background:var(--ok);color:#06180D}
@media (prefers-reduced-motion:reduce){.toast,.tile,.scan{transition:none}.tile:hover{transform:none}}

/* calendário de vendas */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1020px){.cal-wrap{grid-template-columns:minmax(0,1fr)}}
.cal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cal-title{margin:0;font-family:var(--font-d);font-size:clamp(26px,3.2vw,34px);font-weight:700;line-height:1.05;color:var(--gold-hi)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wd{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cd{font:inherit;color:var(--fg);text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:10px;min-height:88px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;gap:2px;cursor:pointer;min-width:0}
.cd:hover{border-color:var(--gold)}
.cd .dn{font-size:12px;color:var(--muted)}
.cd .ct{font-family:var(--font-d);font-variant-numeric:lining-nums;font-size:22px;font-weight:700;line-height:1}
.cd .tt{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.cd.l1{background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.cd.l2{background:color-mix(in srgb,var(--gold) 28%,var(--surface))}
.cd.l3{background:color-mix(in srgb,var(--gold) 46%,var(--surface))}
.cd.l2 .dn,.cd.l2 .tt,.cd.l3 .dn,.cd.l3 .tt{color:var(--fg);opacity:.85}
.cd.l4{background:var(--gold);border-color:var(--gold-hi);color:var(--on-gold)}
.cd.l4 .dn,.cd.l4 .tt{color:var(--on-gold);opacity:.8}
.cd.today{border-color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold-hi)}
.cd.sel{outline:2px solid var(--fg);outline-offset:2px}
.cd.blank{visibility:hidden;pointer-events:none}
.legend{display:flex;align-items:center;gap:6px;margin-top:16px;font-size:12px;color:var(--muted)}
.legend .cd{width:20px;height:20px;min-height:0;padding:0;display:block;border-radius:5px;cursor:default}
.legend .cd:hover{border-color:var(--line)}
.cal-day h3{font-size:24px}
.cal-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cal-kpis b{display:block;font-family:var(--font-d);font-variant-numeric:lining-nums;font-size:20px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.dlist{list-style:none;margin:14px 0 0;padding:0}
.dlist li{display:flex;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.dl-main{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline;min-width:0}
.dl-main span{color:var(--muted);font-size:13px}
.dl-end{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlist li.cx .dl-main,.dlist li.cx .dl-end b{text-decoration:line-through;opacity:.55}
.pill.mut{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
@media (max-width:560px){.cd{min-height:56px;padding:5px}.cd .ct{font-size:20px}.cd .tt{display:none}.cal-grid{gap:4px}}

/* topo da venda, armazenamento, carregamento e comprovante pronto */
.todaychip{font:inherit;display:inline-flex;align-items:baseline;gap:8px;background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold-hi);border-radius:999px;padding:8px 18px;cursor:pointer;min-height:44px}
.todaychip b{font-family:var(--font-d);font-variant-numeric:lining-nums;font-size:20px;line-height:1}
.todaychip span{color:var(--fg);font-weight:600;margin-left:6px}
.cloud{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:5px 11px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.cloud i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.cloud.on{color:var(--fg)}
.cloud.on i{background:var(--ok)}
.boot{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;color:var(--muted)}
.boot p{margin:0}
.ok-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.tick{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold-hi);display:grid;place-items:center;flex:none}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actions .btn{min-height:52px;font-size:16px}

/* logo oficial: altura fixa, largura automática, sem distorção */
.logo{height:46px;width:auto;flex:none;display:block;border-radius:8px}
.lg-art .logo{height:64px}
/* cadastro de produto */
.modal.wide{max-width:780px}
.pimg{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pimg-box{width:128px;height:128px;border-radius:12px;border:1px dashed var(--line-gold);background:var(--surface2);display:grid;place-items:center;overflow:hidden;flex:none;text-align:center}
.pimg-box img{width:100%;height:100%;object-fit:contain;background:#fff}
.pimg-box span{font-size:12px;color:var(--muted);padding:8px}
.pimg-btns{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pimg-btns .hint{margin:0}
label.btn{display:inline-flex;align-items:center;margin:0;font-size:14px;color:var(--fg);text-transform:none;letter-spacing:0;cursor:pointer}
/* leitor de tela e teclado: o campo de arquivo continua focável; o rótulo mostra o foco */
.sr-only{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;opacity:0}
#f-img:focus-visible + label{outline:3px solid var(--gold-hi);outline-offset:2px}
.pimg-btns{position:relative}
.actions .btn:only-child{grid-column:1/-1}
textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;resize:vertical;min-height:64px}
textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.margin{display:flex;gap:8px 22px;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--gold-soft);border:1px solid var(--line-gold);font-size:14px;color:var(--muted)}
.margin b{color:var(--gold-hi);font-weight:700;margin-left:4px}
.margin b.bad,.margin span.bad{color:var(--bad)}
.pimg-th{height:92px;width:auto;max-width:100%;object-fit:contain;border-radius:8px}
.pn .ico .ico-img{width:38px;height:46px;object-fit:cover;border-radius:6px}
/* relatórios: período, gráfico e fechamento */
.rep-bar{display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.rep-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rep-bar .seg{max-width:100%;flex-wrap:wrap}
.rep-title{font-family:var(--font-d);font-size:clamp(22px,2.6vw,28px);font-weight:700;margin:0;line-height:1.1;color:var(--gold-hi);text-align:center}
.chart{width:100%;height:auto;display:block;overflow:visible;margin-top:8px}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--font-b)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .cbar{fill:url(#gBar)}
.chart .cbar0{fill:var(--line)}
.chart rect{transition:opacity .15s}
/* toque e arrasto escolhem o período; pan-y deixa a página rolar na vertical */
.chart{touch-action:pan-y;cursor:pointer;outline:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.chart:focus-visible{outline:2px solid var(--gold-hi);outline-offset:4px;border-radius:6px}
.chart .hit{fill:transparent}
.chart .cbar:hover{opacity:.85}
.chart .cbar.on{stroke:var(--gold-hi);stroke-width:1.5}
.chart .dim{opacity:.32}
.chart-box{position:relative;margin-top:8px}
.chart-box .chart{margin-top:0}
/* cada barra cresce ao aparecer; a coluna sob o mouse e a coluna escolhida ganham fundo */
.chart .cbar,.chart .cbar0{transform-box:fill-box;transform-origin:50% 100%;animation:barGrow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*16ms)}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart .hit.pin{fill:rgba(201,162,75,.07)}
.chart .hit.hov{fill:var(--gold-soft)}
/* etiqueta com o valor da barra */
.ctip{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,calc(-100% - 10px));background:var(--surface2);border:1px solid var(--line-gold);border-radius:10px;padding:6px 10px;white-space:nowrap;text-align:center;box-shadow:0 12px 24px -14px var(--shadow);transition:left .15s ease,top .15s ease}
.ctip[data-side=l]{transform:translate(-12px,calc(-100% - 10px))}
.ctip[data-side=r]{transform:translate(calc(-100% + 12px),calc(-100% - 10px))}
.ctip[hidden]{display:none}
.ctip b{display:block;font-family:var(--font-d);font-variant-numeric:lining-nums;font-size:16px;color:var(--gold-hi);line-height:1.2}
.ctip small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.chart-read{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-height:34px;font-size:15px;color:var(--fg);margin-bottom:2px}
.chart-read .hint{margin:0}
.chart-read .cr-main{min-width:0;overflow-wrap:anywhere}
.chart-read .btn{margin-left:auto}
.danger-zone{border-color:rgba(238,133,115,.35)}
.dlv{margin-top:16px;padding:14px;border:1px solid var(--line-gold);border-radius:12px;background:var(--gold-soft)}
.dlv h4{margin:0;font-family:var(--font-d);font-size:17px;color:var(--gold-hi)}
.dmap{position:relative;height:230px;width:100%;margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center}
.dmap-msg{padding:16px;text-align:center;color:var(--muted);font-size:14px}
.dlv-sum{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
.dlv-sum b{color:var(--gold-hi);font-weight:700;margin-left:4px}
.dlv-rule{margin:10px 0 0}
.perms{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0 0;min-width:0}
.perms legend{padding:0 6px;font-family:var(--font-d);font-weight:700;color:var(--gold-hi)}
.perm-sum{font-size:14px}

function recompute(){

async function put(col,obj){

  const merged=Object.assign({},i>-1?arr[i]:{},obj);
  if(i>-1)arr[i]=merged;else arr.push(merged);
  recompute();
  writeDoc(col,merged);
}
async function del(col,id){

async function putMany(col,list){

/* carrega o SDK do Firebase; se não carregar, o app segue no armazenamento anterior ou só neste aparelho */

function loadFirebase(){
  if(window.firebase&&window.firebase.firestore)return Promise.resolve(window.firebase);
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>rej(new Error('lento')),6000);
    (function next(i){
      if(i===FB_SDK.length){clearTimeout(t);return res(window.firebase)}
      const s=document.createElement('script');
      s.src=FB_SDK[i];s.async=false;
      s.onload=()=>next(i+1);
      s.onerror=()=>{clearTimeout(t);rej(new Error('sdk'))};
      document.head.appendChild(s);
    })(0);
  });
}
async function initStorage(){
  let fb=null;
  try{fb=await loadFirebase()}catch(e){fb=null}
  if(fb&&fb.firestore){startFirebase(fb);return}
  let dbc=null;
  try{if(window.claude&&window.claude.use)dbc=await window.claude.use('db')}catch(e){dbc=null}

}
/* assina as coleções ao vivo: qualquer aparelho que grava aparece nos outros sem recarregar */
function listen(r,bad){
  const check=()=>{if(!ready&&COLS.every(c=>loaded[c])&&loaded.meta){ready=true;render()}else if(ready)softRefresh()};
  COLS.forEach(c=>{
    unsubs.push(r.collection(c).onSnapshot(snap=>{
      db[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      if(!snap.metadata.fromCache)loaded[c]=true;
      recompute();check();
      if(c==='users'&&!db.users.length&&loaded.users&&mode==='firebase')migrateOnce();
    },bad));
  });
  unsubs.push(r.doc('meta/store').onSnapshot(s=>{
    if(s.exists)db.store=Object.assign({name:'Minha adega',info:''},s.data());
    if(!s.metadata.fromCache)loaded.meta=true;
    check();
  },bad));
  setTimeout(()=>{if(!ready){ready=true;render()}},6000);
}
/* login da loja: o Firebase lembra o aparelho; sem login, mostra a tela de conexão */
function startFirebase(fb){
  const app=fb.apps&&fb.apps.length?fb.app():fb.initializeApp(FB_CONFIG);
  fbFs=fb.firestore(app);
  try{fbFs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{fbFs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  fbAuth=fb.auth(app);
  let authSeen=false;
  /* se o servidor não responder, a tela de conexão mostra o aviso em vez de ficar parada */
  setTimeout(()=>{if(!authSeen){mode='signin';ready=true;ui.loginErr='Não consegui falar com o servidor. Confira a internet e recarregue a página.';render()}},8000);
  fbAuth.onAuthStateChanged(u=>{
    authSeen=true;
    if(u){
      if(mode!=='firebase'){mode='firebase';remote=fbFs;listen(fbFs,fbErr)}
      return;
    }
    unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];
    COLS.forEach(c=>{loaded[c]=false});loaded.meta=false;
    mode='signin';remote=null;ui.user=null;ui.cart=[];ui.modal=null;
    ready=true;render();
  });
}
function fbErr(e){

  if(denied){toast('Este aparelho não tem permissão. Entre de novo com o e-mail da loja.','bad');signOutDevice();return}

/* primeira vez na nuvem: copia os dados da versão anterior (se existirem), sem duplicar nada */
async function migrateOnce(){
  if(migrated)return;migrated=true;migrating=true;render();
  let src=null;
  try{if(window.claude&&window.claude.use)src=await window.claude.use('db')}catch(e){src=null}
  try{
    if(src){
      const jobs=[];
      for(const c of COLS){const snap=await src.collection(c).get();snap.docs.forEach(d=>jobs.push(fbFs.collection(c).doc(d.id).set(Object.assign({},d.data(),{id:d.id}))))}
      const st=await src.doc('meta/store').get();
      if(st.exists)jobs.push(fbFs.doc('meta/store').set(st.data()));
      if(jobs.length){await Promise.race([Promise.all(jobs),new Promise(r=>setTimeout(r,8000))]);toast('Dados da versão anterior copiados para a nuvem.','ok')}
    }
  }catch(e){console.error(e)}
  migrating=false;render();
}
/* número do comprovante: com internet, reserva o próximo número na nuvem para dois aparelhos não repetirem */
async function reserveNumber(){
  if(mode==='firebase'&&fbFs){
    try{
      const ref=fbFs.doc('meta/counter');
      const work=fbFs.runTransaction(async t=>{
        const s=await t.get(ref);
        const last=Math.max(s.exists?Number(s.data().last)||0:0,nextN()-1);
        t.set(ref,{last:last+1});return last+1;
      });
      return await Promise.race([work,new Promise((_,rej)=>setTimeout(()=>rej(new Error('lento')),4000))]);
    }catch(e){console.warn('Sem internet: número do comprovante calculado neste aparelho.',e)}
  }
  return nextN();
}

/* período dos relatórios: ver repRange() na seção Relatórios */
function receiptLines(s,W){
  const line='-'.repeat(W);
  const c=t=>{t=String(t);return ' '.repeat(Math.max(0,Math.floor((W-t.length)/2)))+t};
  const lr=(l,r)=>{l=String(l);r=String(r);return l+' '.repeat(Math.max(1,W-l.length-r.length))+r};
  const wrap=t=>{const out=[];let cur='';String(t).split(' ').forEach(w=>{
    while(w.length>W){if(cur){out.push(cur);cur=''}out.push(w.slice(0,W));w=w.slice(W)}
    if(cur&&(cur+' '+w).length>W){out.push(cur);cur=w}else cur=cur?cur+' '+w:w});
    if(cur)out.push(cur);return out};
  const o=[];let boldFrom=0,boldTo=0;
  wrap(db.store.name.toUpperCase()).forEach(l=>o.push(c(l)));boldTo=o.length;
  if(db.store.info)wrap(db.store.info).forEach(l=>o.push(c(l)));
  o.push(c('COMPROVANTE DE VENDA'),c('(sem valor fiscal)'),line);
  o.push(lr('No '+String(s.n).padStart(5,'0'),fmtTime(s.ts)),'Vendedor: '+s.sellerName,line);
  if(s.delivery){
    const dv=s.delivery;o.push(c('ENTREGA'));
    if(dv.name)wrap('Cliente: '+dv.name).forEach(l=>o.push(l));
    wrap('Endereço: '+dv.addr).forEach(l=>o.push(l));
    if(dv.phone)wrap('Telefone: '+dv.phone).forEach(l=>o.push(l));
    o.push(lr('Distância'+(dv.est?' (estimada)':''),dlvNum((Number(dv.km)||0).toFixed(1))+' km'),line);
  }
  s.items.forEach(i=>{wrap(i.name).forEach(l=>o.push(l));o.push(lr('  '+i.qty+' x '+brl(i.price),brl(i.qty*i.price)))});
  o.push(line,lr('Subtotal',brl(s.subtotal)));
  if(s.discount>0)o.push(lr('Desconto','-'+brl(s.discount)));
  if(s.fee>0)o.push(lr('Taxa de entrega',brl(s.fee)));
  const totalIdx=o.length;
  o.push(lr('TOTAL',brl(s.total)),lr('Pagamento',s.pay));
  if(s.pay==='Dinheiro'&&s.received>0)o.push(lr('Recebido',brl(s.received)),lr('Troco',brl(s.change)));
  if(s.canceled){o.push(line,c('*** VENDA CANCELADA ***'));if(s.canceledReason)wrap('Motivo: '+s.canceledReason).forEach(l=>o.push(c(l)))}
  o.push(line);
  wrap('Venda para maiores de 18 anos').forEach(l=>o.push(c(l)));
  o.push(c('Obrigado, volte sempre!'));
  return{lines:o,bold:i=>(i>=boldFrom&&i<boldTo)||i===totalIdx};
}
const receiptText=(s,W)=>receiptLines(s,W||paperCols()).lines.join('\n');

/* PDF montado direto, sem biblioteca: fonte Courier, página do tamanho da bobina */
function makePdf(s){
  const cols=paperCols(),wmm=prefs.paper==='58'?58:80,fs=2.5*72/25.4,lh=3.3,top=4;
  const r=receiptLines(s,cols),hmm=Math.max(top+r.lines.length*lh+8,wmm+10);
  const k=72/25.4,x0=((wmm-cols*1.5)/2*k).toFixed(2);
  const lat=t=>t.replace(/[^\x00-\xFF]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  let cs='';
  r.lines.forEach((l,i)=>{const y=((hmm-top-(i+1)*lh+0.8)*k).toFixed(2);
    cs+='BT /'+(r.bold(i)?'F2':'F1')+' '+fs.toFixed(3)+' Tf '+x0+' '+y+' Td ('+lat(l)+') Tj ET\n'});
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+(wmm*k).toFixed(2)+' '+(hmm*k).toFixed(2)+'] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>',
    '<< /Length '+cs.length+' >>\nstream\n'+cs+'endstream'];
  let out='%PDF-1.4\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
  const xr=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+
    'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return new Blob([u],{type:'application/pdf'});
}
async function saveFile(name,data,type){
  let dl=null;
  try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){dl=null}
  if(dl){
    try{await dl.save({filename:name,data:data});return 'saved'}
    catch(e){return e&&e.code==='declined'?'declined':'error'}
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:type||'text/plain'});
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);return 'saved';
  }catch(e){return 'error'}
}
async function savePdf(id,viaPrint){
  const s=db.sales.find(x=>x.id===id);if(!s)return;
  const r=await saveFile('comprovante-'+String(s.n).padStart(5,'0')+'.pdf',makePdf(s),'application/pdf');
  if(r==='saved')toast(viaPrint?'PDF salvo no tamanho da bobina. Abra o arquivo e imprima na térmica.':'PDF salvo.','ok');
  else if(r==='error')toast('Não foi possível salvar o PDF.','bad');
}
function printReceipt(id){

  const cols=paperCols();
  let pa=$('#printArea');if(!pa){pa=document.createElement('div');pa.id='printArea';document.body.appendChild(pa)}
  pa.innerHTML='<pre style="width:'+(cols*1.5)+'mm">'+esc(receiptText(s,cols))+'</pre>';
  let st=$('#pageStyle');if(!st){st=document.createElement('style');st.id='pageStyle';document.head.appendChild(st)}
  st.textContent='@page{size:'+(prefs.paper==='58'?58:80)+'mm auto;margin:0}';

  try{window.print()}catch(e){done();toast('Não foi possível abrir a impressão.','bad')}
}

/* Calendário de vendas */
function calState(){
  if(!ui.cal){const n=new Date();ui.cal={y:n.getFullYear(),m:n.getMonth(),sel:dayKey(n.getTime())}}
  return ui.cal;
}
function calByDay(){
  const by={};
  visibleSales().forEach(s=>{const k=dayKey(s.ts);const b=by[k]||(by[k]={n:0,total:0,list:[]});b.list.push(s);if(!s.canceled){b.n++;b.total+=s.total}});
  return by;
}
function calPickDay(by){
  const c=calState(),pre=c.y+'-'+pad(c.m+1)+'-',today=dayKey(Date.now());
  if(today.indexOf(pre)===0){c.sel=today;return}
  const days=Object.keys(by).filter(k=>k.indexOf(pre)===0&&by[k].n>0).sort();
  c.sel=days.length?days[days.length-1]:pre+'01';
}
function viewCalendario(){
  const c=calState(),by=calByDay();
  const first=new Date(c.y,c.m,1),dim=new Date(c.y,c.m+1,0).getDate(),lead=first.getDay();
  const pre=c.y+'-'+pad(c.m+1)+'-',today=dayKey(Date.now());
  let max=0,mN=0,mT=0,best=null;
  for(let d=1;d<=dim;d++){const b=by[pre+pad(d)];if(b){mN+=b.n;mT+=b.total;if(b.n>max){max=b.n;best=d}}}
  const wd=['dom','seg','ter','qua','qui','sex','sáb'];
  let cells=wd.map(w=>`<span class="cal-wd" aria-hidden="true">${w}</span>`).join('');
  for(let i=0;i<lead;i++)cells+='<span class="cd blank" aria-hidden="true"></span>';
  for(let d=1;d<=dim;d++){
    const k=pre+pad(d),b=by[k],n=b?b.n:0,lv=n?Math.max(1,Math.ceil(4*n/max)):0;
    const label=d+' de '+first.toLocaleDateString('pt-BR',{month:'long'})+': '+(n?n+(n===1?' venda, ':' vendas, ')+brl(b.total):'sem vendas');
    cells+=`<button class="cd l${lv}${k===today?' today':''}${k===c.sel?' sel':''}" data-a="calSel" data-v="${k}" aria-label="${esc(label)}" aria-pressed="${k===c.sel}"><span class="dn">${d}</span><span class="ct">${n||''}</span><span class="tt">${n?brl0(b.total):''}</span></button>`;
  }
  const title=cap(first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  const sel=by[c.sel]||{n:0,total:0,list:[]};
  const sd=new Date(c.sel+'T12:00:00');
  const dayTitle=sd.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const pays={};sel.list.forEach(s=>{if(s.canceled)return;const p=pays[s.pay]||(pays[s.pay]={n:0,t:0});p.n++;p.t+=s.total});
  const list=sel.list.slice().sort((a,b)=>b.ts-a.ts);
  const admin=ui.user.role==='admin';
  const panel=`<aside class="panel cal-day" aria-live="polite"><h3>${esc(cap(dayTitle))}</h3>
    <div class="cal-kpis"><div><span class="lbl">Vendas</span><b>${sel.n}</b></div><div><span class="lbl">Faturamento</span><b>${brl(sel.total)}</b></div><div><span class="lbl">Ticket médio</span><b>${sel.n?brl(sel.total/sel.n):'—'}</b></div></div>
    ${Object.keys(pays).length?`<div class="chips" style="margin:14px 0 4px">${Object.keys(pays).map(p=>`<span class="pill mut">${esc(p)}: ${pays[p].n} (${brl(pays[p].t)})</span>`).join('')}</div>`:''}
    ${list.length?`<ul class="dlist">${list.map(s=>`<li class="${s.canceled?'cx':''}"><div class="dl-main"><b class="mono">${String(s.n).padStart(5,'0')}</b><span>${fmtHour(s.ts)}</span><span>${esc(s.sellerName)}</span><span>${esc(s.pay)}</span></div><div class="dl-end"><b class="mono">${brl(s.total)}</b>${s.canceled?'<span class="pill bad">Cancelada</span>':''}<button class="btn sm" data-a="openReceipt" data-id="${s.id}">Comprovante</button></div></li>`).join('')}</ul>`:'<p class="empty">Nenhuma venda neste dia.</p>'}
  </aside>`;
  const legend=`<div class="legend" aria-hidden="true"><span>menos vendas</span><i class="cd l0"></i><i class="cd l1"></i><i class="cd l2"></i><i class="cd l3"></i><i class="cd l4"></i><span>mais vendas</span></div>`;
  const sub=mN?`${mN} ${mN===1?'venda':'vendas'} no mês, ${brl(mT)}. Melhor dia: ${best} (${max} ${max===1?'venda':'vendas'}).`:'Nenhuma venda neste mês.';
  return pageHead('Calendário',admin?'Quanto foi vendido em cada dia.':'Suas vendas em cada dia.',`<button class="btn" data-a="csvMonth" ${mN?'':'disabled'}>Baixar planilha do mês</button>`)+
  `<div class="cal-wrap"><section class="panel cal"><div class="cal-head"><div><h2 class="cal-title">${esc(title)}</h2><small>${sub}</small></div>
    <div class="row"><button class="btn sm" data-a="calPrev" aria-label="Mês anterior">‹</button><button class="btn sm" data-a="calToday">Hoje</button><button class="btn sm" data-a="calNext" aria-label="Próximo mês">›</button></div></div>
    <div class="cal-grid">${cells}</div>${legend}</section>${panel}</div>`;

async function csvMonth(){
  const c=calState(),pre=c.y+'-'+pad(c.m+1)+'-';
  const list=visibleSales().filter(s=>dayKey(s.ts).indexOf(pre)===0).sort((a,b)=>a.ts-b.ts);
  const m=v=>Number(v||0).toFixed(2).replace('.',',');
  const rows=[['Nº','Data','Hora','Vendedor','Pagamento','Subtotal','Desconto','Total','Situação']].concat(list.map(s=>[

  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');

/* Relatórios: período, gráfico, fechamento de caixa e tabelas */
const KINDS=[['dia','Dia'],['semana','Semana'],['mes','Mês'],['tudo','Até o momento']];
const UNIT={dia:'hora',semana:'dia',mes:'dia',tudo:'mês'};
let repCache=null;
const commOf=id=>{const u=db.users.find(x=>x.id===id);return u?u.comm:0};
const pctTxt=v=>(Number(v)||0).toFixed(1).replace('.',',')+'%';

/* Intervalo de datas do período escolhido. off=0 é o período atual; -1 o anterior, e assim por diante. */
function repRange(){
  const r=ui.rep,n=new Date(),Y=n.getFullYear(),M=n.getMonth(),D=n.getDate();
  if(r.kind==='tudo'){
    const first=visibleSales().reduce((a,s)=>Math.min(a,s.ts),Date.now());
    return{from:first,to:Date.now()+1,label:'Até o momento',sub:'Desde a primeira venda até agora'};
  }
  if(r.kind==='dia'){
    const d=new Date(Y,M,D+r.off),e=new Date(Y,M,D+r.off+1);
    return{from:d.getTime(),to:e.getTime(),label:cap(d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})),sub:r.off===0?'Hoje':''};
  }
  if(r.kind==='semana'){
    const dow=(n.getDay()+6)%7,base=D-dow+7*r.off;
    const mon=new Date(Y,M,base),nxt=new Date(Y,M,base+7),sun=new Date(Y,M,base+6);
    const f=x=>x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    return{from:mon.getTime(),to:nxt.getTime(),label:'Semana de '+f(mon)+' a '+f(sun)+' de '+sun.getFullYear(),sub:r.off===0?'Esta semana, de segunda a domingo':''};
  }
  const d=new Date(Y,M+r.off,1),e=new Date(Y,M+r.off+1,1);
  return{from:d.getTime(),to:e.getTime(),label:cap(d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})),sub:r.off===0?'Este mês':''};
}

/* Barras do gráfico: horas (dia), dias (semana e mês) ou meses (até o momento) */
/* Cada barra guarda o intervalo de datas dela (from/to), para o toque filtrar as vendas daquele período. */
function repBuckets(kind,R,ok){
  if(kind==='dia'){
    const d0=new Date(R.from),Y=d0.getFullYear(),M=d0.getMonth(),D=d0.getDate();
    const B=[];for(let h=0;h<24;h++)B.push({label:pad(h)+'h',full:pad(h)+'h às '+pad(h+1)+'h',n:0,t:0,
      from:new Date(Y,M,D,h).getTime(),to:new Date(Y,M,D,h+1).getTime()});
    ok.forEach(s=>{const b=B[new Date(s.ts).getHours()];b.n++;b.t+=s.total});
    const used=B.map((b,i)=>b.n?i:-1).filter(i=>i>=0);
    const a=used.length?Math.min(...used):8,z=used.length?Math.max(...used):20;
    return B.slice(Math.max(0,a),Math.min(24,z+1));
  }
  if(kind==='tudo'){
    const B=[],idx={},first=new Date(R.from),now=new Date();
    let y=first.getFullYear(),m=first.getMonth();
    while(y<now.getFullYear()||(y===now.getFullYear()&&m<=now.getMonth())){
      const b={label:pad(m+1)+'/'+String(y).slice(2),full:cap(new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})),n:0,t:0,
        from:new Date(y,m,1).getTime(),to:new Date(y,m+1,1).getTime()};
      idx[y+'-'+m]=b;B.push(b);m++;if(m>11){m=0;y++}
    }
    ok.forEach(s=>{const d=new Date(s.ts),b=idx[d.getFullYear()+'-'+d.getMonth()];if(b){b.n++;b.t+=s.total}});
    return B.slice(-36);
  }
  const B=[],idx={},st=new Date(R.from),days=Math.round((R.to-R.from)/864e5);
  for(let i=0;i<days;i++){
    const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i);
    const wd=kind==='semana'?cap(d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')):'';
    const b={label:kind==='semana'?wd:pad(d.getDate()),sub:kind==='semana'?pad(d.getDate()):undefined,full:cap(d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})),n:0,t:0,
      from:d.getTime(),to:new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime()};
    idx[dayKey(d.getTime())]=b;B.push(b);
  }
  ok.forEach(s=>{const b=idx[dayKey(s.ts)];if(b){b.n++;b.t+=s.total}});
  return B;
}

/* Todos os números do relatório, calculados uma vez por tela. Custo e lucro só para o dono. */
function repData(){
  const R=repRange(),admin=ui.user.role==='admin';
  const all=visibleSales().filter(s=>s.ts>=R.from&&s.ts<R.to).sort((a,b)=>a.ts-b.ts);
  const ok=all.filter(s=>!s.canceled),canc=all.filter(s=>s.canceled);
  const gross=ok.reduce((a,s)=>a+s.subtotal,0),disc=ok.reduce((a,s)=>a+s.discount,0),total=ok.reduce((a,s)=>a+s.total,0);
  let units=0,cost=0;const pays={},sellers={},prods={};
  ok.forEach(s=>{
    const p=pays[s.pay]||(pays[s.pay]={name:s.pay,n:0,t:0});p.n++;p.t+=s.total;
    const v=sellers[s.sellerId]||(sellers[s.sellerId]={name:s.sellerName,n:0,t:0,c:0,comm:commOf(s.sellerId)});v.n++;v.t+=s.total;v.c+=s.total-(s.fee||0);
    s.items.forEach(i=>{units+=i.qty;cost+=i.qty*(i.cost||0);const q=prods[i.id]||(prods[i.id]={name:i.name,qty:0,rev:0});q.qty+=i.qty;q.rev+=i.qty*i.price});
  });
  const lucro=total-cost,margin=total?lucro/total*100:0;
  const cashExp=ok.filter(s=>s.pay==='Dinheiro').reduce((a,s)=>a+s.total,0);
  const fees=ok.reduce((a,s)=>a+(s.fee||0),0),deliveries=ok.filter(s=>s.delivery).length,myBase=ok.filter(s=>s.sellerId===ui.user.id).reduce((a,s)=>a+s.total-(s.fee||0),0);
  return{R,admin,seeAll:seesAll(),fees,deliveries,myBase,all,ok,canc,gross,disc,total,units,cost,lucro,margin,cashExp,
    cancT:canc.reduce((a,s)=>a+s.total,0),
    pays:Object.values(pays).sort((a,b)=>b.t-a.t),
    sellers:Object.values(sellers).sort((a,b)=>b.t-a.t),
    prods:Object.values(prods).sort((a,b)=>b.rev-a.rev).slice(0,10),
    B:repBuckets(ui.rep.kind,R,ok)};
}

/* Gráfico de barras em SVG. Toque, clique, arraste ou use as setas para escolher um período:
   a barra fica destacada, uma etiqueta mostra o valor dela e a lista de vendas abaixo filtra para esse período.
   Com o mouse, passar sobre a coluna mostra a etiqueta sem mudar a escolha. A coluna inteira é a área de toque. */
function barSvg(B,label,sel){
  /* largura do desenho acompanha a tela: o texto fica do tamanho certo no celular e no computador */
  const W=Math.round(Math.min(900,Math.max(300,window.innerWidth-80))),H=258,pl=78,pr=8,pt=50,pb=38;
  const max=Math.max(1,...B.map(b=>b.t)),n=Math.max(1,B.length),bw=(W-pl-pr)/n,gap=Math.min(8,bw*0.28),every=Math.ceil(n/10);
  const has=sel!=null&&sel>=0&&sel<B.length;
  let g='',hits='';
  /* rótulos do eixo: sem vendas não há escala (evita "R$ 1" repetido); se dois rótulos arredondam igual, mostra só um */
  const anyMoney=B.some(b=>b.t>0),lmid=anyMoney&&brl0(max*0.5)!==brl0(max)?brl0(max*0.5):'',ltop=anyMoney?brl0(max):'';
  [0,0.5,1].forEach(f=>{const y=pt+(H-pt-pb)*(1-f);
    const lab=f===0?'0':(f===0.5?lmid:ltop);
    g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>${lab?`<text class="ax" x="${pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end">${esc(lab)}</text>`:''}`});
  B.forEach((b,i)=>{
    const h=Math.max(2,(H-pt-pb)*b.t/max),x=pl+i*bw+gap/2,y=H-pb-h,w=Math.max(2,bw-gap);
    const st=has?(i===sel?' on':' dim'):'';
    hits+=`<rect class="hit" data-i="${i}" x="${(pl+i*bw).toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${(H-pt-pb).toFixed(1)}"/>`;
    g+=`<rect class="${(b.t?'cbar':'cbar0')+st}" style="--i:${i}" data-i="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3"/>`;
    if(b.sub)g+=`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-22}" text-anchor="middle">${esc(b.label)}</text><text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(b.sub)}</text>`;
    else if(i%every===0)g+=`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  const vt=has?`${B[sel].full}: ${B[sel].n} ${B[sel].n===1?'venda':'vendas'}, ${brl(B[sel].t)}`:'Nenhum período selecionado';
  return `<svg class="chart" id="chartSvg" viewBox="0 0 ${W} ${H}" data-w="${W}" data-h="${H}" data-pl="${pl}" data-bw="${bw.toFixed(3)}" data-n="${n}" role="slider" tabindex="0" aria-label="${esc(label)}. Use as setas para escolher um período." aria-valuemin="0" aria-valuemax="${n-1}" aria-valuenow="${has?sel:0}" aria-valuetext="${esc(vt)}">
    <defs><linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--gold-hi)"/><stop offset="1" style="stop-color:var(--gold-lo)"/></linearGradient></defs>${hits}${g}</svg>`;
}
/* faixa de detalhe acima do gráfico */
function chartReadHtml(B,i){
  if(i==null||!B[i])return '<span class="hint">Toque ou clique numa barra para ver o período. Arraste para percorrer. Toque de novo na barra escolhida para limpar.</span>';
  const b=B[i];
  return `<span class="cr-main"><b>${esc(b.full)}</b> · ${b.n} ${b.n===1?'venda':'vendas'} · <b class="mono">${brl(b.t)}</b></span><button class="btn sm ghost" data-a="chartClear">Limpar seleção</button>`;
}

/* Caixa: o dinheiro esperado vem das vendas em dinheiro; o contado é digitado pelo operador */
function cashRes(d){
  if(String(ui.cashCounted||'').trim()==='')return '<span class="hint">Digite o valor contado para ver a diferença.</span>';
  const diff=num(ui.cashCounted)-d.cashExp;
  if(Math.abs(diff)<0.005)return '<span class="ok-txt">Caixa conferido, sem diferença.</span>';
  return diff>0?`Sobra de <b class="mono">${brl(diff)}</b>`:`Falta de <b class="mono bad">${brl(-diff)}</b>`;
}

  const payT=d.pays.length?`<div class="tw"><table class="mini"><thead><tr><th scope="col">Forma</th><th scope="col" class="r">Vendas</th><th scope="col" class="r">Total</th><th scope="col" class="r">%</th></tr></thead><tbody>${d.pays.map(p=>`<tr><td>${esc(p.name)}</td><td class="r mono">${p.n}</td><td class="r mono">${brl(p.t)}</td><td class="r mono">${pctTxt(d.total?p.t/d.total*100:0)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nenhuma venda neste período.</p>';
  const sellT=d.sellers.length?`<div class="tw"><table class="mini"><thead><tr><th scope="col">Vendedor</th><th scope="col" class="r">Vendas</th><th scope="col" class="r">Total</th><th scope="col" class="r">Comissão</th></tr></thead><tbody>${d.sellers.map(s=>`<tr><td>${esc(s.name)}</td><td class="r mono">${s.n}</td><td class="r mono">${brl(s.t)}</td><td class="r mono">${brl(s.c*s.comm/100)} <small>(${s.comm}%)</small></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nenhuma venda neste período.</p>';
  const prodT=d.prods.length?`<div class="tw"><table class="mini"><thead><tr><th scope="col">Produto</th><th scope="col" class="r">Qtd</th><th scope="col" class="r">Faturamento</th></tr></thead><tbody>${d.prods.map(p=>`<tr><td>${esc(p.name)}</td><td class="r mono">${p.qty}</td><td class="r mono">${brl(p.rev)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nenhuma venda neste período.</p>';
  const histT=histHtml(d.all,sel!=null?d.B[sel]:null);
  return pageHead('Relatórios',`${d.all.length} ${d.all.length===1?'venda':'vendas'} no período. ${d.seeAll?'':'Você vê só as suas vendas.'}`,
      '<button class="btn" data-a="xlsxReport">Baixar Excel</button><button class="btn pri" data-a="pdfReport">Baixar PDF</button>')
    +head+hero+chart
    +liveHtml()+`<div class="cols2" style="margin-bottom:16px">${cashBlock(d)}<section class="panel"><h3>Por forma de pagamento</h3>${payT}</section></div>`

    +`<section class="panel"><h3 id="histTitle">${histTitleTxt(sel!=null?d.B[sel]:null)}</h3><div id="histBox">${histT}</div></section>`;
}
function histTitleTxt(b){return b?'Vendas de '+b.full:'Vendas do período'}
/* lista de vendas; com uma barra escolhida, mostra só as vendas daquela faixa de datas */
function histHtml(all,b){
  const admin=ui.user.role==='admin';
  const list=(b?all.filter(s=>s.ts>=b.from&&s.ts<b.to):all).slice().sort((a,c)=>c.ts-a.ts);
  if(!list.length)return `<p class="empty">${b?'Nenhuma venda nesta faixa.':'Nenhuma venda neste período.'}</p>`;
  return `<div class="tw"><table><thead><tr><th scope="col">Nº</th><th scope="col">Data</th><th scope="col">Vendedor</th><th scope="col">Pagamento</th><th scope="col" class="r">Total</th><th scope="col">Situação</th><th scope="col"><span class="sr-only">Ações</span></th></tr></thead><tbody>${list.map(s=>`<tr class="${s.canceled?'cx':''}"><td class="mono">${String(s.n).padStart(5,'0')}</td><td class="mono">${fmtTime(s.ts)}</td><td>${esc(s.sellerName)}</td><td>${esc(s.pay)}</td><td class="r mono">${brl(s.total)}</td><td class="keep">${s.canceled?'<span class="pill bad">Cancelada</span>'+(s.canceledReason?`<small class="cancel-why">${esc(s.canceledBy||'')}: ${esc(s.canceledReason)}</small>`:''):'<span class="pill ok">Concluída</span>'}</td><td class="r keep"><button class="btn sm" data-a="openReceipt" data-id="${s.id}">Comprovante</button>${can('cancel')&&!s.canceled?` <button class="btn sm danger" data-a="cancelSale" data-id="${s.id}">Cancelar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
/* a escolha guarda o início do período, não a posição da barra: continua certa se as vendas mudarem a faixa */
function curSel(){
  if(!repCache||ui.repSelKey==null)return null;
  const i=repCache.B.findIndex(b=>b.from===ui.repSelKey);return i>=0?i:null;
}
/* atualiza só o gráfico e a lista, sem redesenhar a tela: o toque não perde o arrasto */
function paintSel(){
  const d=repCache;if(!d)return;
  const sel=curSel();
  const svg=$('#chartSvg');
  if(svg){
    const vt=sel!=null?`${d.B[sel].full}: ${d.B[sel].n} ${d.B[sel].n===1?'venda':'vendas'}, ${brl(d.B[sel].t)}`:'Nenhum período selecionado';
    svg.setAttribute('aria-valuenow',sel!=null?String(sel):'0');svg.setAttribute('aria-valuetext',vt);
    svg.querySelectorAll('rect.cbar,rect.cbar0').forEach(r=>{const i=+r.dataset.i;
      r.classList.toggle('on',sel!=null&&i===sel);r.classList.toggle('dim',sel!=null&&i!==sel)});
  }
  const rd=$('#chartRead');if(rd)rd.innerHTML=chartReadHtml(d.B,sel);
  const ht=$('#histTitle');if(ht)ht.textContent=histTitleTxt(sel!=null?d.B[sel]:null);
  const hb=$('#histBox');if(hb)hb.innerHTML=histHtml(d.all,sel!=null?d.B[sel]:null);
  paintTip();
}
/* etiqueta com o valor: aparece na barra escolhida e, com o mouse, na coluna sob o ponteiro */
let chartHover=null;
function paintTip(){
  const d=repCache,svg=$('#chartSvg'),tip=$('#chartTip');if(!d||!svg)return;
  const sel=curSel(),idx=chartHover!=null&&chartHover<d.B.length?chartHover:sel;
  svg.querySelectorAll('rect.hit').forEach(h=>{const i=+h.dataset.i;
    h.classList.toggle('hov',chartHover!=null&&i===chartHover);h.classList.toggle('pin',sel!=null&&i===sel)});
  if(!tip)return;
  const bar=idx!=null?svg.querySelector('rect.cbar[data-i="'+idx+'"],rect.cbar0[data-i="'+idx+'"]'):null;
  if(!bar){tip.hidden=true;return}
  const b=d.B[idx],W=+svg.dataset.w,H=+svg.dataset.h,cx=+svg.dataset.pl+(idx+0.5)*+svg.dataset.bw;
  const lp=cx/W*100,tp=(+bar.getAttribute('y'))/H*100;
  tip.hidden=false;tip.dataset.side=lp<16?'l':lp>84?'r':'c';
  tip.style.left=lp.toFixed(2)+'%';tip.style.top=tp.toFixed(2)+'%';
  tip.innerHTML=`<b class="mono">${brl(b.t)}</b><small>${esc(b.full)} · ${b.n} ${b.n===1?'venda':'vendas'}</small>`;
}
function selectBar(i){
  if(!repCache||i==null||i<0||i>=repCache.B.length)return;
  const key=repCache.B[i].from;if(ui.repSelKey===key)return;
  ui.repSelKey=key;paintSel();
}
function clearBar(){if(ui.repSelKey==null)return;ui.repSelKey=null;paintSel()}
/* posição do toque ou do mouse convertida na coluna mais próxima */
function barAt(svg,e){
  const r=svg.getBoundingClientRect();if(!r.width)return null;
  const W=+svg.dataset.w,x=(e.clientX-r.left)*W/r.width;
  const pl=+svg.dataset.pl,bw=+svg.dataset.bw,n=+svg.dataset.n;
  if(x<pl)return null;
  return Math.min(n-1,Math.max(0,Math.floor((x-pl)/bw)));
}
let chartPtr=null;
document.addEventListener('pointerdown',e=>{
  const s=e.target.closest&&e.target.closest('svg.chart');if(!s)return;
  const i=barAt(s,e);if(i==null)return;
  /* tocar numa barra já escolhida e soltar sem arrastar limpa a escolha */
  chartPtr={svg:s,id:e.pointerId,wasSel:curSel()===i,moved:false,last:i};
  try{s.setPointerCapture(e.pointerId)}catch(err){}
  selectBar(i);
});
document.addEventListener('pointermove',e=>{
  if(chartPtr){
    if(e.pointerId!==chartPtr.id)return;
    const i=barAt(chartPtr.svg,e);
    if(i!=null&&i!==chartPtr.last){chartPtr.moved=true;chartPtr.last=i;selectBar(i)}
    return;
  }
  if(e.pointerType!=='mouse')return;
  const s=e.target.closest&&e.target.closest('svg.chart');
  const i=s?barAt(s,e):null;
  if(i!==chartHover){chartHover=i;paintTip()}
});
document.addEventListener('pointerout',e=>{
  if(e.pointerType!=='mouse'||chartHover==null)return;
  const to=e.relatedTarget;
  if(!(to&&to.closest&&to.closest('svg.chart'))){chartHover=null;paintTip()}
});
document.addEventListener('pointerup',e=>{
  if(chartPtr&&e.pointerId===chartPtr.id&&!chartPtr.moved&&chartPtr.wasSel)clearBar();
  chartPtr=null;
});
document.addEventListener('pointercancel',()=>{chartPtr=null});
